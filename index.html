<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casefile — Registration Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5EF; --paper-raised: #FFFFFF; --ink: #202A36; --ink-soft: #5B6472; --line: #DFD9CB;
    --seal: #96602F; --seal-soft: #F1E4D4; --amber: #B4842E; --amber-soft: #F6ECD9;
    --green: #3F6B4A; --green-soft: #E4EEE5; --focus: #3B5B82; --focus-soft: #E4EAF1; --danger: #A23B33; --danger-soft: #F5E1DF;
    --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter', -apple-system, sans-serif;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1E22; --paper-raised: #23262B; --ink: #ECE7DC; --ink-soft: #A7A296;
      --line: #383B40; --seal-soft: #33291F; --amber-soft: #332C1C; --green-soft: #1E2A21; --focus-soft: #202B38; --danger-soft: #3A2220;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1E22; --paper-raised: #23262B; --ink: #ECE7DC; --ink-soft: #A7A296;
    --line: #383B40; --seal-soft: #33291F; --amber-soft: #332C1C; --green-soft: #1E2A21; --focus-soft: #202B38; --danger-soft: #3A2220;
  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); min-height: 100%; }
  html, body { height: 100%; }
  .hidden { display: none !important; }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand .mark { font-family: var(--serif); font-weight: 600; font-size: 20px; }
  .brand .tag { font-size: 12px; color: var(--ink-soft); }
  .topright { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .who { font-size: 12px; color: var(--ink-soft); }

  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 0; min-height: calc(100% - 60px); }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .rail { border-right: 1px solid var(--line); padding: 20px 16px; background: var(--paper); }
  .rail h2 { font-family: var(--serif); font-size: 16px; margin: 0 0 4px; }
  .rail .sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 18px; }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .flag { font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 20px; border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer; user-select: none; background: var(--paper-raised); }
  .flag.on { background: var(--seal-soft); border-color: var(--seal); color: var(--seal); }
  .flag.locked { cursor: default; opacity: .55; }
  .steps { list-style: none; margin: 0; padding: 0; position: relative; }
  .step { display: flex; gap: 10px; padding: 10px 8px; border-radius: 8px; cursor: pointer; position: relative; align-items: flex-start; }
  .step:hover { background: var(--paper-raised); }
  .step.selected { background: var(--paper-raised); box-shadow: inset 3px 0 0 var(--seal); }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-top: 2px; background: var(--paper-raised); }
  .dot.done { background: var(--green); border-color: var(--green); color: #fff; }
  .dot.waiting { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
  .dot.progress { background: var(--focus-soft); border-color: var(--focus); color: var(--focus); }
  .step .label { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
  .step .status-line { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .step .edited { color: var(--seal); font-weight: 700; }

  .main { padding: 28px 32px; overflow-x: auto; }
  @media (max-width: 860px) { .main { padding: 20px 16px; } }
  .case-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .case-head h1 { font-family: var(--serif); font-size: 26px; margin: 0 0 4px; }
  .case-head .addr { color: var(--ink-soft); font-size: 14px; }
  .progress-pill { font-size: 12px; font-weight: 600; color: var(--ink-soft); border: 1px solid var(--line); padding: 6px 12px; border-radius: 20px; white-space: nowrap; }

  .panel { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; margin-bottom: 20px; }
  .panel h3 { font-family: var(--serif); font-size: 18px; margin: 0 0 10px; }
  .explainer { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 16px; max-width: 62ch; }

  .statusbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .statuschip { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 20px; }
  .statuschip.pending { background: var(--line); color: var(--ink-soft); }
  .statuschip.in_progress { background: var(--focus-soft); color: var(--focus); }
  .statuschip.waiting_client { background: var(--amber-soft); color: var(--amber); }
  .statuschip.done { background: var(--green-soft); color: var(--green); }

  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  button.act { font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 9px 15px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); cursor: pointer; }
  button.act.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.act.approve { background: var(--green); color: #fff; border-color: var(--green); }
  button.act.request { background: var(--danger); color: #fff; border-color: var(--danger); }
  button.act:disabled { opacity: .4; cursor: default; }

  .proofbox { margin-top: 14px; padding: 12px 14px; background: var(--green-soft); border-radius: 8px; font-size: 13px; color: var(--green); }
  .proofbox strong { display: block; margin-bottom: 3px; font-size: 12.5px; }
  .proof-files { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .proof-files a { font-size: 11px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); text-decoration: none; cursor: pointer; }

  .docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .doc { border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 13px; }
  .doc .name { font-weight: 600; margin-bottom: 3px; }
  .doc .meta { font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; }
  .doc button { font-size: 11px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; margin-right: 6px; }
  .doc button:disabled { opacity: .5; cursor: default; }
  .lockrow { font-size: 11px; color: var(--ink-soft); margin-top: 10px; }

  .thread { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px; }
  .msg { max-width: 75%; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.45; }
  .msg.staff { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); }
  .msg.client { align-self: flex-end; background: var(--seal-soft); }
  .msg .meta { display: block; font-size: 10.5px; color: var(--ink-soft); margin-top: 3px; }
  .canned { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .canned span { font-size: 11px; padding: 5px 10px; border-radius: 20px; border: 1px dashed var(--line); color: var(--ink-soft); cursor: pointer; user-select: none; }
  .canned span:hover { border-color: var(--seal); color: var(--seal); }
  .composer { display: flex; gap: 8px; }
  .composer textarea, textarea.ed { flex: 1; font-family: var(--sans); font-size: 13.5px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); resize: vertical; min-height: 44px; background: var(--paper); color: var(--ink); width: 100%; }
  textarea.ed { min-height: 220px; line-height: 1.6; margin-bottom: 10px; }
  textarea.ed:disabled { opacity: .6; }

  /* Track changes */
  .diff { white-space: pre-wrap; font-size: 14px; line-height: 1.7; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--paper); margin-bottom: 12px; max-height: 360px; overflow-y: auto; }
  .diff ins { background: var(--green-soft); color: var(--green); text-decoration: none; border-bottom: 2px solid var(--green); padding: 0 1px; }
  .diff del { background: var(--danger-soft); color: var(--danger); text-decoration: line-through; padding: 0 1px; }
  .gb { display: inline-flex; gap: 3px; margin: 0 4px; vertical-align: middle; }
  .gb button { font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); cursor: pointer; }
  .hist-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .hist-row small { color: var(--ink-soft); display: block; }

  /* Auth + admin home */
  .center { min-height: calc(100% - 60px); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .authbox { width: 100%; max-width: 400px; margin: 0; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  .tabs button { flex: 1; border: none; background: var(--paper-raised); color: var(--ink-soft); font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 9px; cursor: pointer; }
  .tabs button.active { background: var(--ink); color: var(--paper); }
  .authbox input { width: 100%; font-family: var(--sans); font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); margin-bottom: 10px; }
  .err { color: var(--danger); font-size: 12.5px; min-height: 16px; margin-bottom: 8px; }
  .linkbtn { background: none; border: none; color: var(--seal); font-size: 12.5px; cursor: pointer; padding: 0; font-family: var(--sans); }
  .urow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .urow small { display: block; color: var(--ink-soft); font-size: 12px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--paper-raised); border-radius: 10px; padding: 24px; max-width: 440px; width: 100%; max-height: 86vh; overflow-y: auto; }
  .modal h4 { font-family: var(--serif); margin: 0 0 10px; font-size: 18px; }
  .modal p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 6px; }
  .modal textarea { width: 100%; font-family: var(--sans); font-size: 13px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); margin: 8px 0; }
  .modal input[type="file"] { font-size: 12px; margin-top: 4px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 99; max-width: 90%; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">📜 Casefile</span><span class="tag">Sale Deed Registration</span></div>
  <div class="topright">
    <span class="who" id="who"></span>
    <button class="act hidden" id="btnAll">← All cases</button>
    <button class="act hidden" id="btnUndo" disabled>↺ Undo</button>
    <button class="act hidden" id="btnOut">Sign out</button>
  </div>
</div>

<div id="auth" class="center">
  <div class="panel authbox">
    <div class="tabs"><button id="tabClient" class="active">Client</button><button id="tabAdmin">Admin</button></div>
    <h3 id="authTitle">Client sign in</h3>
    <input id="aName" placeholder="Full name" class="hidden" autocomplete="name">
    <input id="aEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="aPass" type="password" placeholder="Password (min 8 characters)" autocomplete="current-password">
    <div class="err" id="aErr"></div>
    <div class="btnrow"><button class="act primary" id="aGo">Sign in</button></div>
    <p class="lockrow" id="aSwitchRow"><span id="aSwitchTxt">New here?</span> <button class="linkbtn" id="aSwitch">Create an account</button></p>
  </div>
</div>

<div id="pending" class="center hidden">
  <div class="panel authbox"><h3 id="pendTitle"></h3><p class="explainer" id="pendMsg"></p></div>
</div>

<div id="adminHome" class="main hidden"></div>

<div class="layout hidden" id="app">
  <div class="rail">
    <h2 id="railTitle"></h2>
    <div class="sub" id="railSub"></div>
    <div id="flagsWrap"></div>
    <ul class="steps" id="stepsList"></ul>
  </div>
  <div class="main" id="mainPanel"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBox"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ======== 1. PASTE YOUR FIREBASE WEB CONFIG HERE (Project settings → Your apps → Web app) ========
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyCXJWjqV2RRpg-O_W6Jo3R1WnfWWnFnznw",authDomain:"automatingregistrations.firebaseapp.com",projectId:"automatingregistrations",appId:"1:526527586653:web:bf06a40393548e7fcc48b4"
};
// ===============================================================================================

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();
const TS = () => firebase.firestore.FieldValue.serverTimestamp();

const STAGE_TEMPLATE = [
  { id: 'agreement', name: 'Sale Agreement drafted', explainer: 'The Sale Agreement is prepared on 0.5% stamp paper. Please read it carefully — you can request changes to consideration amount, schedule, or party details before we move on.', approval: true, cond: null },
  { id: 'agreement_stamp', name: 'Stamp duty on agreement paid', explainer: 'Stamp duty (0.5% of consideration) is paid on the e-stamp paper the agreement is printed on. This amount is later adjusted against the Sale Deed\'s stamp duty.', approval: false, cond: null },
  { id: 'poa', name: 'Power of Attorney adjudicated', explainer: 'Since one party is acting through a POA, it needs to be adjudicated and verified before it can be used at registration.', approval: false, cond: 'hasPOA' },
  { id: 'deed_draft', name: 'Sale Deed drafted', explainer: 'This is the main legal document that transfers ownership. Please review it fully — once you approve, we move straight to the Kaveri portal.', approval: true, cond: null },
  { id: 'ekhata', name: 'e-Khata verified', explainer: 'e-Khata confirms the property is recorded in the buyer\'s name for tax purposes after registration. Upload the confirmation once you have it, and we move straight to the next step.', approval: false, cond: null },
  { id: 'kaveri', name: 'Uploaded to Kaveri portal', explainer: 'Karnataka\'s official government system for property registration. Both your and the other party\'s Aadhaar numbers must be linked to an active mobile number, since OTP verification happens here — this is a common hold-up, so please double check this in advance.', approval: false, cond: null },
  { id: 'stamp_payment', name: 'Stamp duty & registration fee paid', explainer: 'The government fee (stamp duty + registration fee) calculated by the Kaveri portal is paid online. This is separate from the earlier agreement stamp duty.', approval: false, cond: null },
  { id: 'slot', name: 'Sub-Registrar slot booked', explainer: 'We book your preferred date and time at the Sub-Registrar\'s office for final registration. Screenshot of the booking and the payment challan are attached here once confirmed.', approval: false, cond: null },
  { id: 'registration', name: 'Registration day', explainer: 'Both parties attend in person for thumb impression, photo and OTP authentication. We\'ll attach a photo of the completed deed here once it\'s done.', approval: true, cond: null },
  { id: 'handover', name: 'Loan handover to seller', explainer: 'Since this purchase involves a home loan, the bank collects the registered deed, e-Khata and Encumbrance Certificate before releasing final payment to the seller.', approval: false, cond: 'hasLoan' },
];
const CANNED_RESPONSES = [
  { tag: 'TDS', text: 'For properties above ₹50 lakh, 1% TDS must be deducted by the buyer and deposited via Form 26QB before registration. We\'ll share the challan copy once filed.' },
  { tag: 'Stamp Duty', text: 'Stamp duty in Karnataka is 5% of the property value or guidance value, whichever is higher, plus 1% registration fee. There\'s no separate concession for first-time buyers currently.' },
  { tag: 'Aadhaar OTP', text: 'Both parties\' Aadhaar numbers need to be linked to a mobile number that can receive OTPs, since the Kaveri portal authenticates identity this way. Please check this is active before our slot.' },
  { tag: 'e-Khata', text: 'e-Khata is the digital property record used for tax and ownership verification — registration cannot proceed without it, so we always confirm it early in the process.' },
];
const DOCUMENT_TYPES = [
  { id: 'aadhaar_seller', name: 'Aadhaar — Seller' }, { id: 'aadhaar_buyer', name: 'Aadhaar — Buyer' },
  { id: 'pan_buyer', name: 'PAN — Buyer' }, { id: 'ekhata', name: 'e-Khata Certificate' },
  { id: 'tax_receipt', name: 'Property Tax Receipt' }, { id: 'prev_deed', name: 'Previous Sale Deed' },
];
const MAX_FILE = 3 * 1024 * 1024, CHUNK = 700000;

// ---------- globals ----------
let me = null, role = null, caseId = null, intended = null;
let currentView = 'client', authTab = 'client', signup = false;
let S = null, U = [], baseUnsubs = [], caseUnsubs = [], undoStack = [], pendingEdit = {}, saveTimers = {}, rafId = 0, lastStage = null;
const $ = id => document.getElementById(id);
const val = id => { const e = $(id); return e ? e.value : ''; };
const C = p => db.doc(`cases/${caseId}/${p}`);
const CC = p => db.collection(`cases/${caseId}/${p}`);
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(t) { return t && t.toDate ? t.toDate().toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'Just now'; }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 4000); }
const fresh = () => ({ flags: {}, stageData: {}, messages: {}, documents: {}, drafts: {}, selected: 'agreement', title: '', address: '', init: false });
function visibleStages(flags) { return STAGE_TEMPLATE.filter(s => !s.cond || flags[s.cond]); }
function statusLabel(st) { return st === 'done' ? 'Done' : st === 'waiting_client' ? 'Waiting on you' : st === 'in_progress' ? 'In progress' : 'Pending'; }
function show(name) { ['auth', 'pending', 'adminHome', 'app'].forEach(n => $(n).classList.toggle('hidden', n !== name)); }
function schedule() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(() => { if (caseId) renderAll(); }); }

// ---------- auth ----------
function setAuthTab(t) {
  authTab = t; signup = false; $('aErr').textContent = '';
  $('tabClient').classList.toggle('active', t === 'client'); $('tabAdmin').classList.toggle('active', t === 'admin');
  renderAuthMode();
}
function renderAuthMode() {
  const adm = authTab === 'admin';
  $('aName').classList.toggle('hidden', !signup);
  $('authTitle').textContent = adm ? 'Admin sign in' : signup ? 'Request access' : 'Client sign in';
  $('aGo').textContent = signup ? 'Create account' : 'Sign in';
  $('aSwitchRow').classList.toggle('hidden', adm);
  $('aSwitchTxt').textContent = signup ? 'Already registered?' : 'New here?';
  $('aSwitch').textContent = signup ? 'Sign in' : 'Create an account';
}
$('tabClient').onclick = () => setAuthTab('client');
$('tabAdmin').onclick = () => setAuthTab('admin');
$('aSwitch').onclick = () => { signup = !signup; renderAuthMode(); };
$('aGo').onclick = async () => {
  const email = val('aEmail').trim(), pw = val('aPass'), name = val('aName').trim();
  $('aErr').textContent = '';
  if (!email || pw.length < 8) { $('aErr').textContent = 'Enter an email and a password of at least 8 characters.'; return; }
  try {
    intended = authTab;
    if (authTab === 'client' && signup) {
      if (!name) { $('aErr').textContent = 'Please enter your name.'; return; }
      const c = await auth.createUserWithEmailAndPassword(email, pw);
      await db.doc('users/' + c.user.uid).set({ name, email, status: 'pending', createdAt: TS() });
    } else await auth.signInWithEmailAndPassword(email, pw);
  } catch (e) { intended = null; $('aErr').textContent = e.message.replace('Firebase: ', ''); }
};
$('btnOut').onclick = () => auth.signOut();
$('btnAll').onclick = () => { closeCase(); showAdminHome(); };

function cleanup() { baseUnsubs.forEach(f => f()); baseUnsubs = []; closeCase(); undoStack = []; $('btnUndo').disabled = true; }
function closeCase() { caseUnsubs.forEach(f => f()); caseUnsubs = []; caseId = null; S = null; pendingEdit = {}; }

auth.onAuthStateChanged(async u => {
  cleanup(); me = u; role = null;
  ['btnOut', 'btnAll', 'btnUndo'].forEach(i => $(i).classList.add('hidden'));
  if (!u) { $('who').textContent = ''; show('auth'); return; }
  $('who').textContent = u.email; $('btnOut').classList.remove('hidden');
  let isAdm = false;
  try { isAdm = (await db.doc('admins/' + u.uid).get()).exists; } catch (e) {}
  if ((intended === 'admin' && !isAdm) || (intended === 'client' && isAdm)) {
    intended = null; await auth.signOut();
    $('aErr').textContent = isAdm ? 'This is an admin account — use the Admin tab.' : 'This account does not have admin access.';
    return;
  }
  intended = null; role = isAdm ? 'admin' : 'client'; currentView = isAdm ? 'staff' : 'client';
  if (isAdm) {
    baseUnsubs.push(db.collection('users').onSnapshot(s => { U = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!caseId) renderAdminHome(); }, e => toast(e.message)));

// ---------- file storage (Firestore chunks, free plan) ----------
function readDataUrl(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }
async function saveFile(f) {
  if (f.size > MAX_FILE) throw new Error(f.name + ' is over 3 MB. Please compress it first.');
  if (!/^(application\/pdf|image\/)/.test(f.type)) throw new Error('Only PDF or image files are allowed.');
  const url = await readDataUrl(f), n = Math.ceil(url.length / CHUNK), fref = CC('files').doc();
  const b = db.batch();
  b.set(fref, { name: f.name, chunks: n, by: me.uid, ts: TS() });
  for (let i = 0; i < n; i++) b.set(fref.collection('chunks').doc(String(i).padStart(3, '0')), { data: url.slice(i * CHUNK, (i + 1) * CHUNK) });
  await b.commit();

}
async function loadFile(fid) {

}
async function saveFiles(list) { const r = []; for (const f of list) r.push(await saveFile(f)); return r; }

// ---------- diff / track changes ----------
function diffWords(a, b) {
  const x = a.split(/(\s+)/).filter(Boolean), y = b.split(/(\s+)/).filter(Boolean), n = x.length, m = y.length, out = [];
  const push = (t, s) => { const l = out[out.length - 1]; l && l.t === t ? l.s += s : out.push({ t, s }); };
  if (a === b) return a ? [{ t: 'eq', s: a }] : [];
  if (n * m > 6e6) { push('del', a); push('ins', b); return out; }
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0;
  while (i < n && j < m) { if (x[i] === y[j]) { push('eq', x[i]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) push('del', x[i++]); else push('ins', y[j++]); }
  while (i < n) push('del', x[i++]); while (j < m) push('ins', y[j++]);
  return out;
}
function rebuild(segs, gi, mode) {
  let g = -1, prevEq = true, B = '', Cc = '';
  for (const s of segs) {
    if (s.t === 'eq') { B += s.s; Cc += s.s; prevEq = true; continue; }
    if (prevEq) { g++; prevEq = false; }
    const hit = g === gi;
    if (s.t === 'del') { if (!(hit && mode === 'accept')) B += s.s; if (hit && mode === 'reject') Cc += s.s; }
    else { if (!(hit && mode === 'reject')) Cc += s.s; if (hit && mode === 'accept') B += s.s; }
  }
  return { baseline: B, current: Cc };
}
function renderDiff(segs) {
  let g = -1, h = '';
  segs.forEach((s, i) => {
    const e = escapeHtml(s.s);
    if (s.t === 'eq') { h += e; return; }
    if (i === 0 || segs[i - 1].t === 'eq') g++;
    h += s.t === 'ins' ? `<ins>${e}</ins>` : `<del>${e}</del>`;
    if (i === segs.length - 1 || segs[i + 1].t === 'eq') h += `<span class="gb"><button data-d="acc" data-g="${g}" title="Accept this change">✓</button><button data-d="rej" data-g="${g}" title="Reject this change">✕</button></span>`;
  });

}
async function draftAct(a, sid, g) {
  const d = S.drafts[sid], ref = C('drafts/' + sid);

  let upd;

  else if (a === 'rejectAll') upd = { current: d.baseline };
  else if (a === 'acc' || a === 'rej') upd = rebuild(diffWords(d.baseline, d.current), +g, a === 'acc' ? 'accept' : 'reject');
  else return;
  upd.updatedBy = me.uid; upd.updatedAt = TS();
  try {
    if (prev) await CC(`drafts/${sid}/revisions`).add({ text: prev.current, by: me.uid, role: 'admin', ts: TS() });
    await ref.set(upd, { merge: true });

}

    $('hClose').onclick = closeModal;

async function openDocModal(docId) {
  const dt = DOCUMENT_TYPES.find(d => d.id === docId), doc = S.documents[docId];
  if (!doc || !doc.uploaded) return;
  openModal(`<h4>${escapeHtml(dt.name)}</h4><p>Loading…</p>`);
  let url = ''; try { url = await loadFile(doc.fid); } catch (e) { toast(e.message); closeModal(); return; }
  const preview = url.startsWith('data:image') ? `<img src="${url}" style="max-width:100%;border-radius:8px;border:1px solid var(--line);margin:10px 0;" />`
    : url.startsWith('data:application/pdf') ? `<embed src="${url}" type="application/pdf" style="width:100%;height:340px;border-radius:8px;border:1px solid var(--line);margin:10px 0;" />` : '';
  openModal(`<h4>${escapeHtml(dt.name)}</h4><p>${escapeHtml(doc.fileName)} · Uploaded ${fmt(doc.uploadedAt)}</p>${preview}<div class="btnrow" style="margin-top:14px;"><button class="act" id="dmClose">Close</button></div>`);
  $('dmClose').onclick = closeModal;
}
function triggerDocUpload(docId) {
  const pick = () => {
    const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/pdf,image/*';
    input.onchange = async () => {
      if (!input.files.length) return;
      try {
        toast('Uploading…'); const f = await saveFile(input.files[0]);
        await C('documents/' + docId).set({ uploaded: true, fileName: f.name, fid: f.fid, uploadedAt: TS() });
      } catch (e) { toast(e.message); }
    };
    input.click();
  };
  (S.documents[docId] || {}).uploaded ? confirmModal('Replace the current file with a new upload?', pick) : pick();
}
function fileModal(stageId, title, intro, cta, nextStatus, needFile) {
  openModal(`<h4>${title}</h4><p>${intro}</p><textarea id="mNote" style="min-height:60px;" placeholder="Short note for the client…"></textarea><input type="file" id="mFiles" accept="application/pdf,image/*" multiple /><div class="btnrow" style="margin-top:16px;"><button class="act" id="mCancel">Cancel</button><button class="act primary" id="mGo">${cta}</button></div>`);
  $('mCancel').onclick = closeModal;
  $('mGo').onclick = async () => {
    const fl = $('mFiles').files; if (needFile && !fl.length) { toast('Please attach at least one file.'); return; }
    const note = $('mNote').value.trim(), d = S.stageData[stageId], prev = { status: d.status, proofNote: d.proofNote || '', files: d.files || [] };
    $('mGo').disabled = true;
    try {
      const nf = await saveFiles(Array.from(fl));
      await C('stages/' + stageId).update({ status: nextStatus, proofNote: note || (nextStatus === 'done' ? 'Marked done.' : 'Draft attached for your review.'), files: prev.files.concat(nf) });
      pushUndo(() => C('stages/' + stageId).update(prev));
      closeModal();
      if (nextStatus === 'done') { const st = visibleStages(S.flags), i = st.findIndex(s => s.id === stageId); if (i < st.length - 1) S.selected = st[i + 1].id; }
    } catch (e) { toast(e.message); $('mGo').disabled = false; }
  };
}

// ---------- actions ----------
function handleStaffAction(a, sid) {
  const stage = STAGE_TEMPLATE.find(s => s.id === sid);
  if (a === 'mark_done') fileModal(sid, `Mark "${escapeHtml(stage.name)}" as done`, 'Add a note and attach PDF/image proof (max 3 MB each). The client sees it too.', 'Mark done', 'done', false);
  if (a === 'send_draft') fileModal(sid, 'Send draft for review', 'Attach the draft file. The client will see Approve / Request Changes.', 'Send to client', 'waiting_client', true);
  if (a === 'mark_progress') confirmModal('Mark this stage as in progress?', async () => {
    const prev = { status: S.stageData[sid].status };
    try { await C('stages/' + sid).update({ status: 'in_progress' }); pushUndo(() => C('stages/' + sid).update(prev)); } catch (e) { toast(e.message); }
  });
}
function handleClientAction(a, sid) {
  if (a === 'approve') confirmModal('Approve this stage? Your coordinator will be notified to proceed.', async () => {
    try {
      const d = S.stageData[sid];
      await C('stages/' + sid).update({ status: 'done', approved: true, proofNote: d.proofNote || 'Client approved this stage.' });
      await addMessage(sid, 'Approved — looks good, please proceed to the next step.');
      const st = visibleStages(S.flags), i = st.findIndex(s => s.id === sid); if (i < st.length - 1) S.selected = st[i + 1].id;
    } catch (e) { toast(e.message); }
  });
  if (a === 'request_changes') {
    openModal(`<h4>Request changes</h4><p>Tell your coordinator what needs to change.</p><textarea id="rcText" style="min-height:80px;" placeholder="e.g. Please correct the survey number in the schedule."></textarea><div class="btnrow" style="margin-top:12px;"><button class="act" id="rcCancel">Cancel</button><button class="act request" id="rcSubmit">Send request</button></div>`);
    $('rcCancel').onclick = closeModal;
    $('rcSubmit').onclick = async () => {
      const t = val('rcText').trim(); if (!t) return;
      try { await C('stages/' + sid).update({ status: 'in_progress' }); await addMessage(sid, 'Requesting changes: ' + t); closeModal(); } catch (e) { toast(e.message); }
    };
  }
}
function addMessage(sid, text) {
  return CC('messages').add({ uid: me.uid, from: role === 'admin' ? 'staff' : 'client', text, stageId: sid, ts: TS() });
}
async function sendMessage(sid) {
  const text = val('msgBox').trim(); if (!text) return;
  try {
    const ref = await addMessage(sid, text); $('msgBox').value = '';
    if (role === 'admin') pushUndo(() => ref.delete());
  } catch (e) { toast(e.message); }
}
</script>
