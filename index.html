    wrap.style.display = picked ? 'none' : 'block';
  };
  document.getElementById('dsNo').onclick = closeModal;
  document.getElementById('dsYes').onclick = async () => {
    const hist = text => addDoc(collection(db, 'cases', currentCase.id, 'history'), {
      stageId, action:'baseline_publish', before:d.baselineText||'', after:text, actorUid:userProfile.uid, createdAt:serverTimestamp()
    });

      closeModal();

        await hist(text);
        await updateStage(stageId, {
          mode:'docx', docxFileId:fid, docxName:picked.name, baselineHtml:'', clientHtml:'', baselineText:text, clientText:text, clientEdited:false, status:'waiting_client', editingLocked:false
        });
        await sendMessage(stageId, 'staff', 'A draft document has been published for your review.');

    closeModal();

      mode:'rich', docxFileId:'', baselineHtml:html, baselineText:text, clientHtml:html, clientText:text, clientEdited:false, status:'waiting_client', editingLocked:false

    await sendMessage(stageId, 'staff', 'A draft document has been prepared for your review.');
  };

    };

      const ref = doc(db, 'cases', currentCase.id);
      await updateDoc(ref, { intake: intakeData, updatedAt: serverTimestamp() });
      await addDoc(collection(ref, 'history'), {
        stageId: 'intake',

      });
      notify('✓ Property terms sheet updated successfully.');
    } catch(err) {
      notify('Could not save terms: ' + err.message, true);
    }
  };
}

/* Chunked File Storage */
async function uploadFile(kind, refId, file=null){
  if(!file){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,image/*';
    input.onchange = () => { if(input.files[0]) uploadFile(kind, refId, input.files[0]); };
    input.click();
    return;
  }
  if(file.size > 3 * 1024 * 1024){ notify('File size exceeds 3 MB limit.', true); return; }
  notify('Uploading ' + file.name + '…');
  const fileRef = doc(collection(db, 'cases', currentCase.id, 'files'));
  await setDoc(fileRef, {
    name: file.name, type: file.type, size: file.size, kind, refId, ownerUid: userProfile.uid, createdAt: serverTimestamp()
  });
  const bytes = new Uint8Array(await file.arrayBuffer());
  const chunkSize = 700000;
  for(let i = 0; i < bytes.length; i += chunkSize){
    const b = bytes.slice(i, i + chunkSize);
    let binary = '';
    for(const x of b) binary += String.fromCharCode(x);
    const data = btoa(binary);
    await setDoc(doc(fileRef, 'chunks', String(Math.floor(i / chunkSize)).padStart(6, '0')), {
      data, createdAt: serverTimestamp()
    });
  }
  notify('✓ Document stored in vault.');
  return fileRef.id;
}

/* =======================================================
   CLIENT EXPERIENCE & DASHBOARD RENDERING
======================================================= */
function calculateCaseHealth(stagesList, allFiles){
  const totalStages = stagesList.length || 1;
  const doneStages = stagesList.filter(s => (currentCase.stages?.[s.id]?.status) === 'done').length;
  const stageRatio = doneStages / totalStages;

  const uploadedDocIds = new Set((allFiles || []).filter(f => f.kind === 'document').map(f => f.refId));
  const docRatio = Math.min(uploadedDocIds.size / DOCUMENT_TYPES.length, 1);

  const score = Math.round((stageRatio * 60) + (docRatio * 40));

  const docsReady = docRatio >= 0.8;
  const agreementApproved = (currentCase.stages?.agreement?.status === 'done');
  const kaveriReady = (currentCase.stages?.kaveri?.status === 'done' || currentCase.stages?.kaveri?.status === 'in_progress');
  const slotBooked = (currentCase.stages?.slot?.status === 'done');

  return { score, docsReady, agreementApproved, kaveriReady, slotBooked, uploadedDocCount: uploadedDocIds.size };
}

function determineNextAction(stagesList, allFiles){
  const activeStage = stagesList.find(s => {
    const st = currentCase.stages?.[s.id]?.status;
    return st === 'waiting_client' || st === 'in_progress';
  }) || stagesList[0];

  const stageData = currentCase.stages?.[activeStage.id] || {};

  if(stageData.status === 'waiting_client' && activeStage.approval){
    return {
      title: `Review & approve: ${activeStage.name}`,
      desc: 'Your legal coordinator has submitted the draft for your review. Please inspect the terms, request modifications, or approve.',
      cta: 'Review Document Now',
      action: 'focus_editor',
      stageId: activeStage.id
    };
  }

  // If terms sheet has not been touched yet, invite client
  if(!currentCase?.intake?.saleConsideration && !currentCase?.intake?.propertyType){
    return {
      title: 'Complete Property Terms Sheet',
      desc: 'Set your property type, consideration amount, and seller NRI status so drafting is tailored to your agreement.',
      cta: 'Open Terms Sheet',
      action: 'switch_terms',
      stageId: activeStage.id
    };
  }

  const uploadedDocIds = new Set((allFiles || []).filter(f => f.kind === 'document').map(f => f.refId));
  const missingDoc = DOCUMENT_TYPES.find(d => !uploadedDocIds.has(d.id));
  if(missingDoc){
    return {
      title: `Upload missing document: ${missingDoc.name}`,
      desc: 'To prevent government verification delays at the Sub-Registrar office, upload a clear digital scan.',
      cta: 'Open Document Vault',
      action: 'switch_vault',
      stageId: activeStage.id
    };
  }

  if(stageData.status === 'in_progress'){
    return {
      title: `In progress: ${activeStage.name}`,
      desc: 'Our legal team is currently preparing the documentation and coordinating with Karnataka revenue offices.',
      cta: 'Send Note to Coordinator',
      action: 'focus_messages',
      stageId: activeStage.id
    };
  }

  return {
    title: 'Conveyance on Track',
    desc: 'All milestones scheduled for this phase have been fulfilled.',
    cta: 'View Milestone Details',
    action: 'focus_milestone',
    stageId: activeStage.id
  };
}

function parseAppointmentDetails(){
  const slotStage = currentCase.stages?.slot;
  if(!slotStage || !slotStage.proofNote) return null;
  const note = slotStage.proofNote;
  const match = note.match(/(\d{4}-\d{2}-\d{2})|(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/);
  if(!match) return null;
  const parsedDate = new Date(match[0]);
  if(isNaN(parsedDate.getTime())) return null;
  return { date: parsedDate, note };
}

  const stage = STAGE_TEMPLATE.find(s => s.id === selectedStage) || STAGE_TEMPLATE[0];
  const d = currentCase.stages?.[stage.id] || { status:'pending', files:[], baselineText:'', clientText:'' };
  const isAdmin = currentView === 'admin';
  const allFiles = currentCase._files || [];
  const stageFiles = allFiles.filter(f => f.kind === 'stage' && f.refId === stage.id);

  let actionsHtml = '';
  if(isAdmin){
    const sendLabel = d.status === 'waiting_client' ? 'Revise & Resend Draft' : 'Upload Draft for Review';
    actionsHtml = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm" data-action="progress" ${d.status!=='pending' ? 'disabled' : ''}>Mark In Progress</button>
        ${stage.approval ? `<button class="btn btn-sm btn-primary" data-action="send" ${d.status==='pending'||d.status==='done' ? 'disabled' : ''}>${sendLabel}</button>` : `<button class="btn btn-sm btn-primary" data-action="done" ${d.status==='done' ? 'disabled' : ''}>Mark Done + Attach Proof</button>`}
        ${stage.approval ? `<button class="btn btn-sm" data-action="editor">${d.editingLocked ? 'Unlock Client Editing' : 'Lock Client Editing'}</button>` : ''}
        ${stage.approval ? `<button class="btn btn-sm" data-action="history">History</button>` : ''}
      </div>`;
  } else if(d.status === 'waiting_client' && stage.approval){
    actionsHtml = `
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-approve" data-action="approve">✓ Approve Draft, Looks Good</button>
        <button class="btn btn-danger" data-action="changes">Request Changes / Revisions</button>
      </div>`;
  } else {
    actionsHtml = `
      <div style="display:flex;gap:8px;">
        <span class="status-chip ${d.status}">${statusLabel(d.status)}</span>
        ${d.status==='done' ? '<span style="font-size:12.5px;color:var(--emerald);align-self:center;">Milestone completed</span>' : '<span style="font-size:12.5px;color:var(--ink-muted);align-self:center;">Legal team will advance this step</span>'}
      </div>`;
  }

  const dx = d.mode === 'docx' && !!d.docxFileId;
  const rich = !!d.baselineHtml && !dx;

  let editorHtml = '';
  if(stage.approval && (d.baselineText || rich || dx)){
    editorHtml = `
      <div class="content-panel" style="margin-top:20px;">
        <div class="panel-header">
          <div>
            <h4 class="panel-title">Legal Document Drafting Workspace</h4>
            <p class="panel-desc">
              ${isAdmin ? 'Direct in-browser Word document editor. Edits autosave continuously. Client proposed changes are flagged with change markers.' : 'Review the drafting terms. If editing is unlocked by your advocate, typing will autosave your tracked changes.'}
            </p>
          </div>
          <div>
            <span class="status-chip ${d.editingLocked ? 'pending' : 'waiting_client'}">
              ${d.editingLocked ? '🔒 Editing Locked' : '✏️ Client Editing Open'}
            </span>
          </div>
        </div>

        ${dx ? `
          ${isAdmin ? `
            <div class="change-review-bar" id="chgInfo">
              <div class="change-stats-box">
                <span id="chgCountBadge" class="status-chip waiting_client">⚡ Checking Revisions…</span>
                <span id="chgSummaryText" style="font-size:12px;color:var(--ink-secondary);">Yellow = client additions, Strikethrough = deletions</span>
              </div>
              <div class="change-nav-btns">
                <button type="button" class="btn btn-sm" id="btnPrevChange" title="Previous change">▲ Prev Change</button>
                <button type="button" class="btn btn-sm" id="btnNextChange" title="Next change">▼ Next Change</button>
                <button type="button" class="btn btn-sm btn-approve" id="btnAcceptAllChanges" title="Accept all changes">✓ Accept All</button>
                <button type="button" class="btn btn-sm btn-danger" id="btnRejectAllChanges" title="Reject all changes">✕ Reject All</button>
              </div>
            </div>
          ` : ''}
          <div class="editor-workspace" id="dxWrap">
            <div class="editor-header-bar">
              <span class="editor-status-text">
                <strong>Word Document (.docx):</strong> ${esc(d.docxName || 'draft.docx')}
              </span>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${isAdmin ? '' : '<button type="button" class="btn btn-sm" id="undoEdits">Undo My Edits</button>'}
                <button type="button" class="btn btn-sm" id="dlClient">Download ${isAdmin?'Client Version':''} (.docx)</button>
                <button type="button" class="btn btn-sm" id="dlOrig">Download Original (.docx)</button>
                ${isAdmin ? '<button type="button" class="btn btn-sm" id="dxUndo">Undo Decision</button>' : ''}
              </div>
            </div>
            ${rteBar(!isAdmin && !!d.editingLocked, true)}
            <div id="dxStyle"></div>
            <div class="dx-body" id="dxBody"><p style="padding:28px;opacity:0.7;">Loading Word document preview…</p></div>
            <div class="editor-footer-stats">
              <span class="editor-word-count">Calculating stats…</span>
              <span style="color:var(--emerald);">✓ Autosave Active · Stored in Case Vault</span>
            </div>
          </div>
        ` : ''}

        ${dx ? '' : rich ? `
          <div class="editor-workspace" id="rteWrap">
            <div class="editor-header-bar">
              <span class="editor-status-text"><strong>Rich Document Draft</strong></span>
              <div style="display:flex;gap:6px;">
                ${isAdmin ? '' : '<button class="btn btn-sm" id="undoEdits">Undo My Edits</button>'}
                <button class="btn btn-sm" id="dlClient">Download (.docx)</button>
                ${isAdmin ? '<button class="btn btn-sm" id="dlBase">Download Original (.docx)</button>' : ''}
              </div>
            </div>
            ${rteHtml('richEditor', d.clientHtml || d.baselineHtml, isAdmin || !!d.editingLocked)}
          </div>
        ` : (!isAdmin ? `
          <div style="margin-top:12px;">
            <textarea id="clientEditor" ${d.editingLocked ? 'disabled' : ''} class="composer-input" style="width:100%;min-height:280px;font-family:var(--serif);font-size:15px;line-height:1.6;padding:16px;">${esc(d.clientText || d.baselineText)}</textarea>
            <div style="margin-top:10px;display:flex;justify-content:flex-end;">
              <button class="btn btn-sm" id="undoEdits">Undo My Edits</button>
            </div>
          </div>
        ` : '')}
      </div>`;
  }

  container.innerHTML = `
    <div class="content-panel">
      <div class="panel-header">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:22px;">${stage.icon || '📄'}</span>
            <h3 class="panel-title" style="margin:0;">${esc(stage.name)}</h3>
            <span class="status-chip ${d.status}">${statusLabel(d.status)}</span>
          </div>
          <p class="panel-desc">${esc(stage.explainer)}</p>
        </div>
      </div>

      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
        ${actionsHtml}
      </div>

      ${(d.proofNote || stageFiles.length) ? `
        <div class="proof-box" style="background:var(--canvas-subtle);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-top:16px;">
          <h5 style="margin:0 0 6px;font-size:11.5px;text-transform:uppercase;color:var(--ink-muted);">${d.status==='waiting_client' ? 'Draft Transmittal Note' : 'Proof & Official Acknowledgments'}</h5>
          <div style="font-size:13.5px;color:var(--ink);">${esc(d.proofNote || '')}</div>
          ${stageFiles.length ? `
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
              ${stageFiles.map(f => `<button class="btn btn-sm" data-fileview="${f.id}">📎 ${esc(f.name)} (${(f.size/1024).toFixed(0)} KB)</button>`).join(' ')}
            </div>
          ` : ''}
        </div>
      ` : ''}
    </div>

    ${editorHtml}
  `;

  // Action listeners
  container.querySelectorAll('[data-action]').forEach(b => {
    b.onclick = () => handleAction(b.dataset.action, stage.id);
  });
  container.querySelectorAll('[data-fileview]').forEach(b => {
    b.onclick = () => openFile(b.dataset.fileview);
  });

  const dlc = document.getElementById('dlClient');
  if(dlc) dlc.onclick = () => downloadDocx(d.clientHtml || d.baselineHtml, 'client-version');
  const dlb = document.getElementById('dlBase');
  if(dlb) dlb.onclick = () => downloadDocx(d.baselineHtml, 'original');

  const rw = document.getElementById('rteWrap');
  if(rw && !isAdmin){
    let t;
    const body = rw.querySelector('.rte-body');
    wireRte(rw, () => {
      clearTimeout(t);
      t = setTimeout(() => saveClientEdit(stage.id, htmlText(body.innerHTML), body.innerHTML), 900);
    });
    const ue = document.getElementById('undoEdits');
    if(ue) ue.onclick = () => saveClientEdit(stage.id, d.baselineText||'', d.baselineHtml);
  }

  if(rich && isAdmin && d.clientHtml){
    const rb = document.getElementById('richEditor'), tmp = document.createElement('div');
    tmp.innerHTML = clean(d.baselineHtml);
    highlightDx(rb, dxTokens(tmp).map(t => t.text));
  }

  if(dx){
    const wrap = document.getElementById('dxWrap'), body = document.getElementById('dxBody'), sty = document.getElementById('dxStyle');
    mountDocx(stage.id, isAdmin, d);
    wireRte(wrap, () => {
      clearTimeout(at);
      at = setTimeout(() => saveAdminEdit(stage.id, body), 900);
    });
    const bPrev = document.getElementById('btnPrevChange');
    if(bPrev) bPrev.onclick = () => jumpToNextChange(-1);
    const bNext = document.getElementById('btnNextChange');
    if(bNext) bNext.onclick = () => jumpToNextChange(1);
    const bAccAll = document.getElementById('btnAcceptAllChanges');
    if(bAccAll) bAccAll.onclick = () => resolveAllChanges(true, stage.id);
    const bRejAll = document.getElementById('btnRejectAllChanges');
    if(bRejAll) bRejAll.onclick = () => resolveAllChanges(false, stage.id);
    if(!isAdmin){
      let t;
      wireRte(wrap, () => {
        clearTimeout(t);
        t = setTimeout(() => saveDxEdit(stage.id, body), 900);
      });
      const ue = document.getElementById('undoEdits');
      if(ue){
        ue.onclick = async () => {
          await setDoc(doc(db, 'cases', currentCase.id, 'drafts', stage.id), {
            fileId:d.docxFileId, clientHtml:'', baseText:'', updatedAt:serverTimestamp()
          });
          await updateStage(stage.id, { clientText:d.baselineText||'', clientEdited:false });
          notify('Reverted to original document draft.');
        };
      }
    }

    const origDl = async () => {
      try {
        const bl = await dxBlob(d.docxFileId);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(bl);
        a.download = d.docxName || 'draft.docx';
        a.click();
      } catch(e) { notify(e.message, true); }
    };
    const doBtn = document.getElementById('dlOrig');
    if(doBtn) doBtn.onclick = origDl;

    if(isAdmin){
      body.oncontextmenu = e => {
        const el = e.target.closest('mark.chg, del.chg-del');
        if(!el) return;
        e.preventDefault();
        showCtx(e.clientX, e.clientY, el, stage.id);
      };
      let at;
      wireRte(wrap, () => {
        clearTimeout(at);
        at = setTimeout(() => saveAdminEdit(stage.id, body), 900);
      });
      const dxu = document.getElementById('dxUndo');
      const has = () => (window._dxStack || []).some(x => x.stageId === stage.id);
      if(dxu){
        dxu.disabled = !has();
        dxu.onclick = async () => {
          const st = window._dxStack || [];
          const i = st.map(x => x.stageId).lastIndexOf(stage.id);
          if(i < 0) return;
          const [pv] = st.splice(i, 1);
          try {
            await setDoc(doc(db, 'cases', currentCase.id, 'drafts', stage.id), {
              fileId:d.docxFileId, clientHtml:pv.clientHtml, baseText:pv.baseText, updatedAt:serverTimestamp()
            }, { merge:true });
            await updateStage(stage.id, { clientEdited:true });
            notify('Decision undone.');
          } catch(e) { notify(e.message, true); }
        };
      }
    }
  }

  if(!isAdmin){
    const ed = document.getElementById('clientEditor');
    if(ed){
      let timer;
      ed.oninput = () => {
        clearTimeout(timer);
        timer = setTimeout(() => saveClientEdit(stage.id, ed.value), 900);
      };
      const ue = document.getElementById('undoEdits');
      if(ue) ue.onclick = () => saveClientEdit(stage.id, d.baselineText || '');
    }
  }
}

/* Tab 3: Document Vault */
function renderVaultWorkspace(container){
  const allFiles = currentCase._files || [];
  const isAdmin = currentView === 'admin';
  const categories = ['Identity', 'Property & Records'];

  let html = `
    <div class="content-panel">
      <div class="panel-header">
        <div>
          <h3 class="panel-title">Document Vault</h3>
          <p class="panel-desc">
            Encrypted repository for mandatory government identity cards, revenue records, and conveyance title deeds.
          </p>
        </div>
        ${isAdmin ? '' : `
          <button class="btn btn-primary" id="btnUploadGenericDoc">+ Upload Document</button>
        `}
      </div>
  `;

  categories.forEach(cat => {
    const docsInCat = DOCUMENT_TYPES.filter(d => d.category === cat);
    html += `
      <div class="vault-category-title">${cat} Documents</div>
      <div class="doc-vault-grid">
        ${docsInCat.map(dt => {
          const matchedFiles = allFiles.filter(f => f.kind === 'document' && f.refId === dt.id);
          const hasFile = matchedFiles.length > 0;
          return `
            <div class="doc-card">
              <div>
                <div class="doc-card-top">
                  <div class="doc-card-icon">
                    <svg style="width:20px;height:20px;fill:currentColor;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                  </div>
                  <div>
                    <div class="doc-card-name">${esc(dt.name)}</div>
                    <div class="doc-card-meta">${hasFile ? 'Verified in Vault' : 'Required for Registration'}</div>
                  </div>
                </div>
                <div>
                  <span class="status-chip ${hasFile ? 'done' : 'pending'}">
                    ${hasFile ? '✓ Uploaded' : 'Missing'}
                  </span>
                </div>
              </div>
              <div class="doc-card-actions">
                ${matchedFiles.map(f => `
                  <button class="btn btn-sm" data-fileview="${f.id}">📎 View</button>
                `).join('')}
                ${isAdmin ? '' : `
                  <button class="btn btn-sm btn-brass" data-doc="${dt.id}">
                    ${hasFile ? 'Replace File' : 'Upload File'}
                  </button>
                `}
              </div>
            </div>`;
        }).join('')}
      </div>`;
  });

  const proofFiles = allFiles.filter(f => f.kind === 'stage' || f.kind === 'draft');
  if(proofFiles.length > 0){
    html += `
      <div class="vault-category-title" style="margin-top:24px;">Government Challans & Draft Uploads</div>
      <div class="doc-vault-grid">
        ${proofFiles.map(f => `
          <div class="doc-card">
            <div>
              <div class="doc-card-top">
                <div class="doc-card-icon">📎</div>
                <div>
                  <div class="doc-card-name">${esc(f.name)}</div>
                  <div class="doc-card-meta">Type: ${esc(f.kind)} · Size: ${(f.size/1024).toFixed(0)} KB</div>
                </div>
              </div>
              <span class="status-chip done">Stored</span>
            </div>
            <div class="doc-card-actions">
              <button class="btn btn-sm" data-fileview="${f.id}">Preview / Download</button>
            </div>
          </div>
        `).join('')}
      </div>`;
  }

  html += `</div>`;
  container.innerHTML = html;

  container.querySelectorAll('[data-doc]').forEach(b => {
    b.onclick = () => uploadFile('document', b.dataset.doc);
  });
  container.querySelectorAll('[data-fileview]').forEach(b => {
    b.onclick = () => openFile(b.dataset.fileview);
  });
  const genBtn = document.getElementById('btnUploadGenericDoc');
  if(genBtn){
    genBtn.onclick = () => {
      openModal(`
        <h4 class="modal-title">Select Document Type to Upload</h4>
        <p class="modal-desc">Choose which required document category you are attaching.</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin:16px 0;">
          ${DOCUMENT_TYPES.map(dt => `
            <button class="btn" style="justify-content:flex-start;padding:10px 14px;" data-pickdoc="${dt.id}">
              🪪 ${esc(dt.name)}
            </button>
          `).join('')}
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn" id="pickCancel">Cancel</button>
        </div>`);
      document.getElementById('pickCancel').onclick = closeModal;
      document.querySelectorAll('[data-pickdoc]').forEach(b => {
        b.onclick = () => {
          const docId = b.dataset.pickdoc;
          closeModal();
          uploadFile('document', docId);
        };
      });
    };
  }
}

/* Tab 4: Case Activity Timeline */
function renderTimelineWorkspace(container){
  container.innerHTML = `
    <div class="content-panel">
      <div class="panel-header">
        <div>
          <h3 class="panel-title">Case Activity Audit Timeline</h3>
          <p class="panel-desc">Official chronological event log of drafting revisions, client approvals, and filing updates.</p>
        </div>
      </div>
      <div id="timelineEventsContainer" style="padding:16px 0;">Loading activity events…</div>
    </div>`;

  const q = query(collection(db, 'cases', currentCase.id, 'history'), orderBy('createdAt', 'desc'), limit(30));
  getDocs(q).then(s => {
    const el = document.getElementById('timelineEventsContainer');
    if(!el) return;
    if(s.empty){
      el.innerHTML = '<p style="font-size:13.5px;color:var(--ink-muted);">No activity recorded yet in this case timeline.</p>';
      return;
    }
    el.innerHTML = `
      <ul class="timeline-feed">
        ${s.docs.map(d => {
          const x = d.data();
          const act = (x.action || '').replace('_', ' ');
          const isClient = x.action === 'client_edit' || x.action === 'client_approve';
          return `
            <li class="timeline-event ${isClient ? 'highlight' : ''}">
              <div class="timeline-dot">
                ${x.action==='client_edit' ? '✍️' : x.action==='intake_update' ? '📋' : x.action==='stage_update' ? '✓' : '📄'}
              </div>
              <div class="timeline-body">
                <div class="timeline-title">${esc(act.toUpperCase())} — Milestone: ${esc(x.stageId || 'General')}</div>
                <div style="font-size:13px;color:var(--ink-secondary);margin-bottom:4px;">
                  ${x.after ? (typeof x.after === 'string' ? `Updated content (${x.after.length} characters)` : 'Updated terms details') : 'Stage state transition'}
                </div>
                <div class="timeline-time">${tsLabel(x.createdAt)}</div>
              </div>
            </li>`;
        }).join('')}
      </ul>`;
  }).catch(err => {
    const el = document.getElementById('timelineEventsContainer');
    if(el) el.innerHTML = '<p style="color:var(--ruby);">' + esc(err.message) + '</p>';
  });
}

/* Tab 5: Legal Messaging */
function renderMessagesWorkspace(container){
  const stage = STAGE_TEMPLATE.find(s => s.id === selectedStage) || STAGE_TEMPLATE[0];
  const msgs = (currentCase._messages || []).filter(m => m.stageId === stage.id);
  const isAdmin = currentView === 'admin';

  container.innerHTML = `
    <div class="content-panel">
      <div class="panel-header">
        <div>
          <h3 class="panel-title">Legal Communication: ${esc(stage.name)}</h3>
          <p class="panel-desc">
            Direct communication with your dedicated legal coordinator for inquiries regarding this conveyance milestone.
          </p>
        </div>
      </div>

      <div class="message-thread" id="msgThreadBox">
        ${msgs.length ? msgs.map(m => `
          <div class="msg-row ${m.from}">
            <div class="msg-bubble">${esc(m.text)}</div>
            <div class="msg-info">
              ${m.from==='staff' ? 'Coordinator / Advocate' : 'Property Buyer'} · ${tsLabel(m.createdAt)}
            </div>
          </div>
        `).join('') : `
          <div style="text-align:center;padding:32px 0;color:var(--ink-muted);font-size:13.5px;">
            💬 No questions recorded for this milestone yet. Send a note below.
          </div>
        `}
      </div>

      ${isAdmin ? `
        <div class="canned-chips">
          <span style="font-size:11px;color:var(--ink-muted);align-self:center;">Quick Templates:</span>
          ${CANNED_RESPONSES.map((c, i) => `
            <span class="canned-chip" data-canned="${i}">+ ${c.tag}</span>
          `).join('')}
        </div>
      ` : ''}

      <div class="composer-box">
        <textarea id="msgBox" class="composer-input" placeholder="${isAdmin ? 'Reply to client with legal instructions…' : 'Ask a question regarding this document or stage…'}"></textarea>
        <button class="btn btn-primary" id="btnSendMsg" style="padding:12px 18px;">Send</button>
      </div>
    </div>`;

  const thread = document.getElementById('msgThreadBox');
  if(thread) thread.scrollTop = thread.scrollHeight;

  document.querySelectorAll('[data-canned]').forEach(e => {
    e.onclick = () => {
      const box = document.getElementById('msgBox');
      if(box) box.value = CANNED_RESPONSES[e.dataset.canned].text;
    };
  });

  const sendBtn = document.getElementById('btnSendMsg');
  const box = document.getElementById('msgBox');
  if(sendBtn) sendBtn.onclick = () => sendMessage(stage.id);
  if(box){
    box.onkeydown = e => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage(stage.id);
      }
    };
  }
}

    const kpiPen = document.getElementById('kpiPendingClients');

    const penEl = document.getElementById('pendingClients');
    if(penEl){
      penEl.innerHTML = `

            <strong style="color:var(--ink);">Kavita Nair</strong>
            <div style="font-size:12px;color:var(--ink-muted);">kavita.nair@example.com · Registered Today · Plot Purchase</div>
          </div>

            <button class="btn btn-sm btn-approve" onclick="notify('Demo Mode: Client verified.')">Approve & Create Case</button>

    }
    const kpiAct = document.getElementById('kpiActiveCases');
    if(kpiAct) kpiAct.textContent = '3';
    const kpiStaff = document.getElementById('kpiAwaitingStaff');

    const demoCases = [

        clientName: 'Siddharth Rao',
        property: 'Brigade Cornerstone 2BHK',
        address: 'ITPL Road, Whitefield, Bengaluru',
        selectedStage: 'agreement',
        intake: { propertyType: 'Apartment / Flat', saleConsideration: '8800000', sellerType: 'resident' },
        flags: { hasPOA: false, hasLoan: true },

      },
      {
        id: 'CF-2026-0045',
        clientName: 'Sunita & Arvind Swaminathan',
        property: 'Sobha Dream Acres Flat 402',
        address: 'Panathur Main Road, Bengaluru',
        selectedStage: 'appointment',
        intake: { propertyType: 'Apartment / Flat', saleConsideration: '11200000', sellerType: 'nri' },

    window._allAdminCases = demoCases;
    renderAdminCasesTable(demoCases);

    const searchInp = document.getElementById('adminSearchInput');

                 (c.id||'').toLowerCase().includes(q);
        });
        renderAdminCasesTable(filtered);
      };
    }
    return;
  }

  // 1. Pending users
  const pending = await getDocs(query(collection(db, 'users'), where('status', '==', 'pending')));
  const penEl = document.getElementById('pendingClients');
  const kpiPen = document.getElementById('kpiPendingClients');

  if(penEl){

      ? '<p style="font-size:13px;color:var(--ink-muted);margin:6px 0;">✓ No pending client signups awaiting verification.</p>'

function renderAdminCasesTable(casesList){
  const tb = document.getElementById('caseListTableBody');
  if(!tb) return;
  if(!casesList.length){
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--ink-muted);">No matching cases found.</td></tr>';
    return;
  }
  tb.innerHTML = casesList.map(c => {
    const caseRef = 'CF-' + (c.id.slice(0, 4).toUpperCase()) + '-' + (c.id.slice(4, 8).toUpperCase() || '2026');
    const stageKey = c.selectedStage || 'agreement';
    const stageObj = STAGE_TEMPLATE.find(s => s.id === stageKey) || { name: stageKey };
    const stageState = c.stages?.[stageKey]?.status || 'pending';
    const it = c.intake || {};

    return `
      <tr>
        <td style="font-family:var(--mono);font-weight:600;color:var(--ink);">${caseRef}</td>
        <td>
          <div style="font-weight:600;">${esc(c.clientName || 'Client')}</div>
        </td>
        <td>
          <div><strong>${esc(c.property || 'Property')}</strong></div>
          <div style="font-size:11px;color:var(--ink-muted);">${esc(it.propertyType || 'Apartment')} · ${esc(c.address || '')}</div>
          ${it.sellerType === 'nri' ? '<span class="status-chip waiting_client" style="font-size:9.5px;padding:1px 6px;margin-top:2px;">NRI Seller</span>' : ''}
        </td>
        <td>
          <div style="font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--brass);">
            ${it.saleConsideration ? formatIndianRupees(it.saleConsideration) : '<span style="color:var(--ink-muted);font-weight:normal;">Unspecified</span>'}
          </div>
        </td>
        <td>
          <div style="font-weight:500;">${esc(stageObj.name)}</div>
          <span class="status-chip ${stageState}" style="font-size:10.5px;padding:2px 8px;margin-top:3px;">${statusLabel(stageState)}</span>
        </td>
        <td>
          <div style="display:flex;gap:4px;">
            ${c.flags?.hasPOA ? '<span class="status-chip in_progress" style="font-size:10px;">POA ✓</span>' : '<span style="font-size:10px;color:var(--ink-muted);">POA Off</span>'}
            ${c.flags?.hasLoan ? '<span class="status-chip pending" style="font-size:10px;">LOAN ✓</span>' : ''}
          </div>
        </td>
        <td style="font-size:12px;color:var(--ink-muted);">${tsLabel(c.updatedAt)}</td>
        <td>
          <button class="btn btn-sm btn-primary" data-case="${c.id}">Open Workspace</button>
        </td>
      </tr>`;
  }).join('');

  tb.querySelectorAll('[data-case]').forEach(b => {
    b.onclick = () => openAdminCase(b.dataset.case);
  });
}

async function approveClient(uid){
  const u = (await getDoc(doc(db, 'users', uid))).data();
  if(!u) return;
  const caseId = await createCaseForClient({ uid, name:u.name, email:u.email });
  await updateDoc(doc(db, 'users', uid), {
    status:'approved', caseId, approvedAt:serverTimestamp(), approvedBy:userProfile.uid
  });
  notify('✓ Client verified and case initialized.');
  loadAdminLists();
}

async function rejectClient(uid){
  await updateDoc(doc(db, 'users', uid), {
    status:'rejected', rejectedAt:serverTimestamp(), rejectedBy:userProfile.uid
  });
  notify('Client registration rejected.');
  loadAdminLists();
}

async function openAdminCase(caseId){
  if(userProfile?.isDemo){
    const found = (window._allAdminCases || []).find(c => c.id === caseId) || currentCase;
    currentCase = found;
    currentView = 'admin';
    selectedStage = currentCase.selectedStage || 'deed_draft';
    currentWorkspaceTab = 'milestone';
    renderApp();
    return;
  }
  const s = await getDoc(doc(db, 'cases', caseId));
  if(!s.exists()) return;
  currentCase = { id:s.id, ...s.data() };
  currentView = 'admin';
  selectedStage = currentCase.selectedStage || 'agreement';
  currentWorkspaceTab = 'milestone';
  subscribeMessages();
  if(unsubscribeCase) unsubscribeCase();
  unsubscribeCase = onSnapshot(doc(db, 'cases', caseId), sn => {
    if(!sn.exists()) return;
    const p = currentCase;
    currentCase = { ...sn.data(), id:sn.id, _messages:p?._messages, _files:p?._files };
    renderApp();
  }, err => notify(err.message, true));
  renderApp();
}

// Show login screen initially
loginScreen();

// Firebase Auth listener
if(firebaseReady){
  onAuthStateChanged(auth, async user => {
    if(signingUp) return;
    if(!user){ userProfile = null; loginScreen(); return; }
    try {
      userProfile = await loadProfile(user.uid);
      if(!userProfile){
        await signOut(auth);
        loginScreen();
        notify('Account not found in authorization records.', true);
        return;
      }
      if(userProfile.role === 'admin'){ await subscribeAdmin(); return; }
      if(userProfile.status === 'pending'){ await signOut(auth); loginScreen(); notify('Account is awaiting administrative verification.'); return; }
      if(userProfile.status === 'rejected'){ await signOut(auth); loginScreen(); notify('Account was not approved.', true); return; }
      if(userProfile.status === 'revoked'){ await signOut(auth); showRevoked(); return; }
      await subscribeClientCase();
    } catch(e) {
      console.error(e);
      await signOut(auth).catch(() => {});
      loginScreen();
      notify(e.message || 'Error loading profile credentials.', true);
    }
  });
}

window.addEventListener('beforeunload', () => {
  if(unsubscribeCase) unsubscribeCase();
  if(unsubscribeMessages) unsubscribeMessages();
});
