<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casefile Portal</title>
<style>
:root{--paper:#F7F5EF;--raised:#fff;--ink:#202A36;--soft:#5B6472;--line:#DFD9CB;--seal:#96602F;--green:#3F6B4A;--gs:#E4EEE5;--red:#A23B33;--rs:#F6E1DE;--amber:#F6ECD9;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
.top b{font-family:Georgia,serif;font-size:19px}
.card{max-width:380px;margin:60px auto;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:22px}
.tabs{display:flex;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{flex:1;border:0;padding:9px;background:var(--raised);font-weight:600;cursor:pointer;color:var(--soft)}
.tabs .on{background:var(--ink);color:var(--paper)}
input,textarea{width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:var(--paper);color:var(--ink)}
button{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:var(--raised);cursor:pointer;color:var(--ink)}
button:disabled{opacity:.4;cursor:default}.pri{background:var(--ink);color:var(--paper);width:100%}
.ok{background:var(--green)!important;color:#fff!important}.no{background:var(--red)!important;color:#fff!important}
.err{color:var(--red);font-size:13px;min-height:18px}.sm{font-size:12.5px;color:var(--soft)}
.lay{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 54px)}
@media(max-width:800px){.lay{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);padding:16px}aside h4{margin:14px 0 8px;font-family:Georgia,serif}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--raised);font-size:13px}
.row.sel{border-color:var(--seal);box-shadow:inset 3px 0 var(--seal)}
.wrap,main{padding:22px;max-width:920px}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-family:Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:8px;padding:11px;font-size:13px}.doc .m{font-size:11px;color:var(--soft);margin:3px 0 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pv{white-space:pre-wrap;line-height:1.7;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-height:120px}
ins{background:var(--gs);color:var(--green);text-decoration:none;padding:0 2px;border-radius:3px}
del{background:var(--rs);color:var(--red);padding:0 2px;border-radius:3px}
.hb{display:inline-flex;gap:2px;margin-left:3px;vertical-align:middle}.hb button{padding:0 6px;font-size:12px;line-height:20px}
.badge{display:inline-block;background:var(--amber);color:var(--seal);font-size:12px;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal>div{background:var(--raised);padding:18px;border-radius:10px;max-width:700px;width:100%;max-height:90vh;overflow:auto}
.modal img,.modal iframe{width:100%;border:1px solid var(--line);border-radius:8px;margin:10px 0}.modal iframe{height:60vh}
textarea#ta,textarea#ae{min-height:240px;line-height:1.6}
</style></head><body><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,collection,query,where,onSnapshot,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== 1. PASTE YOUR FIREBASE CONFIG HERE (Project settings → Your apps → Web) ======
const firebaseConfig={apiKey:"AIzaSyCXJWjqV2RRpg-O_W6Jo3R1WnfWWnFnznw",authDomain:"automatingregistrations.firebaseapp.com",projectId:"automatingregistrations",appId:"1:526527586653:web:bf06a40393548e7fcc48b4"};
// =====================================================================================

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DT=[['aadhaar_seller','Aadhaar — Seller'],['aadhaar_buyer','Aadhaar — Buyer'],['pan_buyer','PAN — Buyer'],['ekhata','e-Khata Certificate'],['tax_receipt','Property Tax Receipt'],['prev_deed','Previous Sale Deed']];
const CH=700000; // chars per Firestore chunk (doc limit is 1 MiB)
let S={tab:'client',signup:false,msg:'',subs:[],cs:[],cuid:null,isAdmin:false,mounted:null,d:null,editing:false,pend:[],cli:[]};
const clear=()=>{S.subs.forEach(u=>u());S.cs.forEach(u=>u());S.subs=[];S.cs=[];S.mounted=null;S.cuid=null;S.editing=false};
const shell=(inner,out)=>app.innerHTML=`<div class="top"><b>📜 Casefile</b>${out?'<button data-act="out">Sign out</button>':''}</div>${inner}`;
const mainRef=()=>doc(db,'cases',S.cuid,'docs','main');

// ---------- AUTH ----------
function authView(){const c=S.tab==='client';shell(`<div class="card"><div class="tabs">
<button data-act="tab" data-t="client" class="${c?'on':''}">Client login</button><button data-act="tab" data-t="admin" class="${c?'':'on'}">Admin login</button></div>
${S.signup&&c?'<input id="nm" placeholder="Full name">':''}<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6 chars)">
<button class="pri" data-act="go">${S.signup&&c?'Request access':'Sign in'}</button><p class="err">${esc(S.msg)}</p>
${c?`<p class="sm">${S.signup?'Already approved?':'New client?'} <a href="#" data-act="tog">${S.signup?'Sign in':'Request access'}</a></p>`:'<p class="sm">Admin accounts are created by the owner in Firebase.</p>'}</div>`)}

onAuthStateChanged(auth,async u=>{clear();if(!u){S.isAdmin=false;return authView()}
 const a=await getDoc(doc(db,'admins',u.uid)).catch(()=>null);
 if(a&&a.exists())return adminView();
 if(S.intent==='admin'){S.msg='This account is not an admin.';return signOut(auth)}
 clientView(u)});

// ---------- CLIENT ----------
function clientView(u){S.subs.push(onSnapshot(doc(db,'users',u.uid),s=>{
 if(!s.exists())return shell('<div class="card"><p>Setting up your account…</p></div>',1);
 const p=s.data();
 if(p.status==='pending')return shell(`<div class="card"><h3>Hi ${esc(p.name)} 👋</h3><p>Your request is <b>awaiting approval</b>. This page updates automatically as soon as your coordinator approves it.</p></div>`,1);
 if(p.status==='rejected')return shell('<div class="card"><p>Your access request was declined. Please contact your coordinator.</p></div>',1);
 if(S.mounted!==u.uid){S.mounted=u.uid;shell('<div class="wrap" id="case"></div>',1);mountCase(u.uid)}
}))}

// ---------- ADMIN ----------
function adminView(){S.isAdmin=true;shell('<div class="lay"><aside id="side"></aside><main id="case"><p class="sm">Select a client on the left.</p></main></div>',1);
 S.subs.push(onSnapshot(query(collection(db,'users'),where('status','==','pending')),s=>{S.pend=s.docs.map(d=>({id:d.id,...d.data()}));side()}));
 S.subs.push(onSnapshot(query(collection(db,'users'),where('status','==','approved')),s=>{S.cli=s.docs.map(d=>({id:d.id,...d.data()}));side()}))}
function side(){const e=$('#side');if(!e)return;
 e.innerHTML=`<h4>Access requests (${S.pend.length})</h4>${S.pend.map(p=>`<div class="row"><span>${esc(p.name)}<br><span class="sm">${esc(p.email)}</span></span><span><button class="ok" data-act="appr" data-id="${p.id}">✓</button> <button class="no" data-act="rej" data-id="${p.id}">✕</button></span></div>`).join('')||'<p class="sm">None pending.</p>'}
 <h4>Clients</h4>${S.cli.map(p=>`<div class="row ${S.cuid===p.id?'sel':''}" data-act="pick" data-id="${p.id}" style="cursor:pointer"><span>${esc(p.name)}</span></div>`).join('')||'<p class="sm">No approved clients yet.</p>'}`}

// ---------- CASE (shared by both roles) ----------
function mountCase(uid){S.cs.forEach(u=>u());S.cs=[];S.cuid=uid;S.d=null;S.editing=false;side();
 $('#case').innerHTML=`<div class="panel"><h3>Documents</h3><div class="grid" id="docs"></div></div><div class="panel"><h3>Shared document</h3><div id="ed"></div></div>`;
 S.cs.push(onSnapshot(doc(db,'cases',uid),s=>s.exists()&&renderDocs(s.data().documents||{})));
 S.cs.push(onSnapshot(doc(db,'cases',uid,'docs','main'),s=>{if(!s.exists())return;S.d=s.data();renderEd()}))}

function renderDocs(m){$('#docs').innerHTML=DT.map(([id,n])=>{const f=m[id];
 return`<div class="doc"><b>${n}${f?' ✓':''}</b><div class="m">${f?esc(f.name)+' · '+new Date(f.at).toLocaleString():'Not uploaded'}</div>
 ${f?`<button data-act="view" data-fid="${f.fid}" data-n="${f.n}">View</button> `:''}${S.isAdmin?'':`<button data-act="up" data-t="${id}">${f?'Replace':'Upload'}</button>`}</div>`}).join('')}

async function toDataUrl(f){if(f.type.startsWith('image/')){const i=await new Promise((r,j)=>{const x=new Image();x.onload=()=>r(x);x.onerror=j;x.src=URL.createObjectURL(f)});
 const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}
 return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}

async function upload(tid,f){try{const d=await toDataUrl(f);if(d.length>3.5e6)return alert('File too large (max about 2.5 MB). Please compress it and retry.');
 const old=(await getDoc(doc(db,'cases',S.cuid))).data().documents?.[tid],fid=tid+'_'+Date.now(),n=Math.ceil(d.length/CH),b=writeBatch(db),at=Date.now();
 for(let i=0;i<n;i++)b.set(doc(db,'cases',S.cuid,'files',fid,'chunks',String(i).padStart(3,'0')),{d:d.slice(i*CH,(i+1)*CH)});
 b.update(doc(db,'cases',S.cuid),{['documents.'+tid]:{fid,name:f.name,n,at}});await b.commit();
 if(old){const x=writeBatch(db);for(let i=0;i<old.n;i++)x.delete(doc(db,'cases',S.cuid,'files',old.fid,'chunks',String(i).padStart(3,'0')));await x.commit()}
 }catch(e){alert('Upload failed: '+e.message)}}

async function view(fid){const s=await getDocs(collection(db,'cases',S.cuid,'files',fid,'chunks')),u=s.docs.map(d=>d.data().d).join('');
 const url=URL.createObjectURL(await(await fetch(u)).blob()),img=u.startsWith('data:image');
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div>${img?`<img src="${url}">`:`<iframe src="${url}"></iframe>`}<button data-act="close">Close</button></div>`;document.body.append(m)}

// ---------- SHARED DOCUMENT + TRACKED CHANGES ----------
function diff(a,b){const x=a.split(/(\s+)/).filter(Boolean),y=b.split(/(\s+)/).filter(Boolean),n=x.length,m=y.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const o=[];let i=0,j=0;while(i<n&&j<m){if(x[i]===y[j]){o.push({t:'=',s:x[i]});i++;j++}else if(L[i+1][j]>=L[i][j+1])o.push({t:'-',s:x[i++]});else o.push({t:'+',s:y[j++]})}
 while(i<n)o.push({t:'-',s:x[i++]});while(j<m)o.push({t:'+',s:y[j++]});return o}
function segs(a,b){const s=[];for(const t of diff(a,b)){if(t.t==='='){s.push({eq:t.s});continue}let l=s[s.length-1];if(!l||!l.hunk){l={hunk:1,del:'',ins:''};s.push(l)}l[t.t==='-'?'del':'ins']+=t.s}return s}
const build=(sg,pick)=>sg.map((g,i)=>g.hunk?g[pick(i)]:g.eq).join('');

function renderEd(){const d=S.d,e=$('#ed');if(!e)return;
 if(!S.isAdmin){let ta=$('#ta');
  if(!ta){e.innerHTML='<p class="sm">Edit freely — your coordinator sees every change highlighted automatically.</p><textarea id="ta"></textarea><div class="sm" id="st"></div>';ta=$('#ta');
   ta.oninput=()=>{$('#st').textContent='Saving…';clearTimeout(S.t);S.t=setTimeout(async()=>{try{await updateDoc(mainRef(),{content:ta.value,by:'client',at:Date.now()});$('#st').textContent='Saved ✓'}catch(x){$('#st').textContent='Save failed: '+x.message}},1000)}}
  ta.disabled=!!d.locked;if(d.by==='admin'||document.activeElement!==ta)if(ta.value!==d.content)ta.value=d.content;
  if(d.locked)$('#st').textContent='🔒 Locked by your coordinator — editing is paused.';return}
 if(S.editing)return;
 const sg=segs(d.baseline,d.content),n=sg.filter(g=>g.hunk).length,h=d.history||[];
 e.innerHTML=`${n?`<span class="badge">${n} pending change${n>1?'s':''} · last edit by ${d.by||'—'}, ${new Date(d.at).toLocaleString()}</span>`:'<span class="sm">No pending changes. </span>'}
 <div class="bar"><button class="ok" data-act="accAll" ${n?'':'disabled'}>Accept all</button><button class="no" data-act="rejAll" ${n?'':'disabled'}>Revert all</button>
 <button data-act="undo" ${h.length?'':'disabled'}>↺ Undo last action</button><button data-act="lock">${d.locked?'🔓 Unlock client':'🔒 Lock client'}</button><button data-act="edit">✎ Edit text</button></div>
 <div class="pv">${sg.map((g,i)=>g.hunk?`<span>${g.del?`<del>${esc(g.del)}</del>`:''}${g.ins?`<ins>${esc(g.ins)}</ins>`:''}<span class="hb"><button class="ok" data-act="acc" data-i="${i}" title="Accept">✓</button><button class="no" data-act="rev" data-i="${i}" title="Revert">↩</button></span></span>`:esc(g.eq)).join('')||'<span class="sm">Empty document.</span>'}</div>`}

async function adm(upd){const d=S.d;await updateDoc(mainRef(),{...upd,history:(d.history||[]).concat([{b:d.baseline,c:d.content}]).slice(-20),by:'admin',at:Date.now()})}

// ---------- CLICK ROUTER ----------
const A={
 tab:x=>{S.tab=x.t;S.msg='';authView()},tog:()=>{S.signup=!S.signup;S.msg='';authView()},out:()=>signOut(auth),close:()=>document.querySelector('.modal').remove(),
 go:async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;S.intent=S.tab;S.msg='';
  try{if(S.signup&&S.tab==='client'){const nm=$('#nm').value.trim();if(!nm)throw Error('Please enter your name');
   const c=await createUserWithEmailAndPassword(auth,em,pw);await setDoc(doc(db,'users',c.user.uid),{name:nm,email:em,status:'pending',at:Date.now()})}
   else await signInWithEmailAndPassword(auth,em,pw)}catch(e){S.msg=e.message.replace('Firebase: ','');authView()}},
 appr:async x=>{const p=S.pend.find(q=>q.id===x.id),t=prompt('Case title for this client:',p.name+"'s case");if(!t)return;
  const b=writeBatch(db);b.update(doc(db,'users',x.id),{status:'approved'});b.set(doc(db,'cases',x.id),{title:t,documents:{},at:Date.now()});
  b.set(doc(db,'cases',x.id,'docs','main'),{baseline:'',content:'',history:[],locked:false,by:'admin',at:Date.now()});await b.commit()},
 rej:x=>confirm('Decline this request?')&&updateDoc(doc(db,'users',x.id),{status:'rejected'}),
 pick:x=>mountCase(x.id),
 up:x=>{const i=document.createElement('input');i.type='file';i.accept='application/pdf,image/*';i.onchange=()=>i.files[0]&&upload(x.t,i.files[0]);i.click()},
 view:x=>view(x.fid),
 acc:x=>{const sg=segs(S.d.baseline,S.d.content);adm({baseline:build(sg,k=>k==x.i?'ins':'del')})},
 rev:x=>{const sg=segs(S.d.baseline,S.d.content);adm({content:build(sg,k=>k==x.i?'del':'ins')})},
 accAll:()=>adm({baseline:S.d.content}),rejAll:()=>adm({content:S.d.baseline}),
 undo:()=>{const h=[...(S.d.history||[])],l=h.pop();updateDoc(mainRef(),{baseline:l.b,content:l.c,history:h,by:'admin',at:Date.now()})},
 lock:()=>updateDoc(mainRef(),{locked:!S.d.locked}),
 edit:()=>{S.editing=true;$('#ed').innerHTML=`<p class="sm">Saving sets this text as the new approved version.</p><textarea id="ae"></textarea><div class="bar"><button class="ok" data-act="saveEd">Save</button><button data-act="cancelEd">Cancel</button></div>`;$('#ae').value=S.d.content},
 saveEd:async()=>{const v=$('#ae').value;S.editing=false;await adm({baseline:v,content:v})},
 cancelEd:()=>{S.editing=false;renderEd()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();A[b.dataset.act]?.(b.dataset)});
</script></body></html>
