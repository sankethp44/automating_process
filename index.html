<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casefile — Registration Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5EF;
    --paper-raised: #FFFFFF;
    --ink: #202A36;
    --ink-soft: #5B6472;
    --line: #DFD9CB;
    --seal: #96602F;
    --seal-soft: #F1E4D4;
    --amber: #B4842E;
    --amber-soft: #F6ECD9;
    --green: #3F6B4A;
    --green-soft: #E4EEE5;
    --focus: #3B5B82;
    --focus-soft: #E4EAF1;
    --danger: #A23B33;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1E22; --paper-raised: #23262B; --ink: #ECE7DC; --ink-soft: #A7A296;
      --line: #383B40; --seal-soft: #33291F; --amber-soft: #332C1C; --green-soft: #1E2A21; --focus-soft: #202B38;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1E22; --paper-raised: #23262B; --ink: #ECE7DC; --ink-soft: #A7A296;
    --line: #383B40; --seal-soft: #33291F; --amber-soft: #332C1C; --green-soft: #1E2A21; --focus-soft: #202B38;
  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); min-height: 100%; }
  html, body { height: 100%; }

  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--paper); border-bottom: 1px solid var(--line);
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand .mark { font-family: var(--serif); font-weight: 600; font-size: 20px; }
  .brand .tag { font-size: 12px; color: var(--ink-soft); }
  .topright { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .viewswitch { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .viewswitch button {
    border: none; background: var(--paper-raised); color: var(--ink-soft); font-family: var(--sans);
    font-size: 13px; font-weight: 600; padding: 8px 14px; cursor: pointer;
  }
  .viewswitch button.active { background: var(--ink); color: var(--paper); }
  .demo-note { font-size: 11px; color: var(--ink-soft); max-width: 240px; line-height: 1.4; }

  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 0; min-height: calc(100% - 60px); }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .rail { border-right: 1px solid var(--line); padding: 20px 16px; background: var(--paper); }
  .rail h2 { font-family: var(--serif); font-size: 16px; margin: 0 0 4px; }
  .rail .sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 18px; }

  .flags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .flag {
    font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer; user-select: none;
    background: var(--paper-raised);
  }
  .flag.on { background: var(--seal-soft); border-color: var(--seal); color: var(--seal); }
  .flag.locked { cursor: default; opacity: .55; }

  .steps { list-style: none; margin: 0; padding: 0; position: relative; }
  .step { display: flex; gap: 10px; padding: 10px 8px; border-radius: 8px; cursor: pointer; position: relative; align-items: flex-start; }
  .step:hover { background: var(--paper-raised); }
  .step.selected { background: var(--paper-raised); box-shadow: inset 3px 0 0 var(--seal); }
  .dot {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    margin-top: 2px; background: var(--paper-raised);
  }
  .dot.done { background: var(--green); border-color: var(--green); color: #fff; }
  .dot.waiting { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
  .dot.progress { background: var(--focus-soft); border-color: var(--focus); color: var(--focus); }
  .step .label { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
  .step .status-line { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .main { padding: 28px 32px; overflow-x: auto; }
  @media (max-width: 860px) { .main { padding: 20px 16px; } }
  .case-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .case-head h1 { font-family: var(--serif); font-size: 26px; margin: 0 0 4px; }
  .case-head .addr { color: var(--ink-soft); font-size: 14px; }
  .progress-pill { font-size: 12px; font-weight: 600; color: var(--ink-soft); border: 1px solid var(--line); padding: 6px 12px; border-radius: 20px; white-space: nowrap; }

  .panel { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; margin-bottom: 20px; }
  .panel h3 { font-family: var(--serif); font-size: 18px; margin: 0 0 10px; }
  .explainer { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 16px; max-width: 62ch; }

  .statusbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .statuschip { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 20px; }
  .statuschip.pending { background: var(--line); color: var(--ink-soft); }
  .statuschip.in_progress { background: var(--focus-soft); color: var(--focus); }
  .statuschip.waiting_client { background: var(--amber-soft); color: var(--amber); }
  .statuschip.done { background: var(--green-soft); color: var(--green); }

  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  button.act {
    font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 9px 15px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); cursor: pointer;
  }
  button.act.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.act.approve { background: var(--green); color: #fff; border-color: var(--green); }
  button.act.request { background: var(--danger); color: #fff; border-color: var(--danger); }
  button.act:disabled { opacity: .4; cursor: default; }

  .proofbox { margin-top: 14px; padding: 12px 14px; background: var(--green-soft); border-radius: 8px; font-size: 13px; color: var(--green); }
  .proofbox strong { display: block; margin-bottom: 3px; font-size: 12.5px; }
  .proof-files { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .proof-files a {
    font-size: 11px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink); text-decoration: none;
  }

  .docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .doc { border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 13px; }
  .doc .name { font-weight: 600; margin-bottom: 3px; }
  .doc .meta { font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; }
  .doc button { font-size: 11px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; margin-right: 6px; }
  .doc button:disabled { opacity: .5; cursor: default; }
  .lockrow { font-size: 11px; color: var(--ink-soft); margin-top: 10px; }

  .thread { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px; }
  .msg { max-width: 75%; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.45; }
  .msg.staff { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); }
  .msg.client { align-self: flex-end; background: var(--seal-soft); }
  .msg .meta { display: block; font-size: 10.5px; color: var(--ink-soft); margin-top: 3px; }

  .canned { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .canned span { font-size: 11px; padding: 5px 10px; border-radius: 20px; border: 1px dashed var(--line); color: var(--ink-soft); cursor: pointer; user-select: none; }
  .canned span:hover { border-color: var(--seal); color: var(--seal); }

  .composer { display: flex; gap: 8px; }
  .composer textarea { flex: 1; font-family: var(--sans); font-size: 13.5px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); resize: vertical; min-height: 44px; background: var(--paper); color: var(--ink); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--paper-raised); border-radius: 10px; padding: 24px; max-width: 440px; width: 100%; max-height: 86vh; overflow-y: auto; }
  .modal h4 { font-family: var(--serif); margin: 0 0 10px; font-size: 18px; }
  .modal p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 6px; }
  .modal textarea { width: 100%; font-family: var(--sans); font-size: 13px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); margin: 8px 0; }
  .modal input[type="file"] { font-size: 12px; margin-top: 4px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.toast-error { background: var(--danger) !important; }

  .rte{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
  .rte-bar{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--paper-raised)}
  .rte-bar button{min-width:30px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;font-size:12px}
  .rte-bar button:disabled{opacity:.4;cursor:default}
  .rte-body{min-height:320px;max-height:70vh;overflow:auto;padding:36px 44px;background:#fff;color:#111;font:15px/1.6 Georgia,serif;outline:none}
  .rte-body[contenteditable=false]{opacity:.8}
  .rte-body table{border-collapse:collapse}.rte-body td,.rte-body th{border:1px solid #999;padding:4px 8px}
  .modal:has(.rte),.modal:has(iframe){width:min(860px,94vw);max-width:none}
  .modal .rte-body{min-height:220px;max-height:45vh}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
<script type="module">
/*
 * CASEFILE — Firebase edition
 *
 * Replace the values in FIREBASE_CONFIG with the Web app config from:
 * Firebase Console -> Project settings -> Your apps -> Web app
 *
 * This file intentionally uses Firebase's modular browser CDN imports so it
 * remains a single index.html.
 */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection,
  deleteDoc, query, orderBy, onSnapshot, serverTimestamp,
  runTransaction, where, getDocs, limit
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCXJWjqV2RRpg-O_W6Jo3R1WnfWWnFnznw",
  authDomain: "automatingregistrations.firebaseapp.com",
  projectId: "automatingregistrations",
  storageBucket: "automatingregistrations.firebasestorage.app",
  messagingSenderId: "526527586653",
  appId: "1:526527586653:web:bf06a40393548e7fcc48b4"
};

let app, auth, db, firebaseReady = false;
const CONFIG_IS_PLACEHOLDER = Object.values(FIREBASE_CONFIG).some(v => String(v).includes('PASTE_'));
try {
  app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app);
  db = getFirestore(app);
  firebaseReady = !CONFIG_IS_PLACEHOLDER;
} catch (e) {
  console.error('Firebase init failed:', e);
}
let signingUp = false;

const STAGE_TEMPLATE = [
  { id:'agreement', name:'Sale Agreement drafted', explainer:'The Sale Agreement is prepared on 0.5% stamp paper. Please read it carefully — you can request changes to consideration amount, schedule, or party details before we move on.', approval:true, cond:null },
  { id:'agreement_stamp', name:'Stamp duty on agreement paid', explainer:'Stamp duty (0.5% of consideration) is paid on the e-stamp paper the agreement is printed on. This amount is later adjusted against the Sale Deed\'s stamp duty.', approval:false, cond:null },
  { id:'poa', name:'Power of Attorney adjudicated', explainer:'Since one party is acting through a POA, it needs to be adjudicated and verified before it can be used at registration.', approval:false, cond:'hasPOA' },
  { id:'deed_draft', name:'Sale Deed drafted', explainer:'This is the main legal document that transfers ownership. Please review it fully — once you approve, we move straight to the Kaveri portal.', approval:true, cond:null },
  { id:'ekhata', name:'e-Khata verified', explainer:'e-Khata confirms the property is recorded in the buyer\'s name for tax purposes after registration. Upload the confirmation once you have it, and we move straight to the next step.', approval:false, cond:null },
  { id:'kaveri', name:'Uploaded to Kaveri portal', explainer:'Karnataka\'s official government system for property registration. Both your and the other party\'s Aadhaar numbers must be linked to an active mobile number, since OTP verification happens here — this is a common hold-up, so please double check this in advance.', approval:false, cond:null },
  { id:'stamp_payment', name:'Stamp duty & registration fee paid', explainer:'The government fee (stamp duty + registration fee) calculated by the Kaveri portal is paid online. This is separate from the earlier agreement stamp duty.', approval:false, cond:null },
  { id:'slot', name:'Sub-Registrar slot booked', explainer:'We book your preferred date and time at the Sub-Registrar\'s office for final registration. Screenshot of the booking and the payment challan are attached here once confirmed.', approval:false, cond:null },
  { id:'registration', name:'Registration day', explainer:'Both parties attend in person for thumb impression, photo and OTP authentication. We\'ll attach a photo of the completed deed here once it\'s done.', approval:true, cond:null },
  { id:'handover', name:'Loan handover to seller', explainer:'Since this purchase involves a home loan, the bank collects the registered deed, e-Khata and Encumbrance Certificate before releasing final payment to the seller.', approval:false, cond:'hasLoan' }
];

const CANNED_RESPONSES = [
  {tag:'TDS',text:'For properties above ₹50 lakh, 1% TDS must be deducted by the buyer and deposited via Form 26QB before registration. We\'ll share the challan copy once filed.'},
  {tag:'Stamp Duty',text:'Stamp duty in Karnataka is 5% of the property value or guidance value, whichever is higher, plus 1% registration fee. There\'s no separate concession for first-time buyers currently.'},
  {tag:'Aadhaar OTP',text:'Both parties\' Aadhaar numbers need to be linked to a mobile number that can receive OTPs, since the Kaveri portal authenticates identity this way. Please check this is active before our slot.'},
  {tag:'e-Khata',text:'e-Khata is the digital property record used for tax and ownership verification — registration cannot proceed without it, so we always confirm it early in the process.'}
];

const DOCUMENT_TYPES = [
  {id:'aadhaar_seller',name:'Aadhaar — Seller'},
  {id:'aadhaar_buyer',name:'Aadhaar — Buyer'},
  {id:'pan_buyer',name:'PAN — Buyer'},
  {id:'ekhata',name:'e-Khata Certificate'},
  {id:'tax_receipt',name:'Property Tax Receipt'},
  {id:'prev_deed',name:'Previous Sale Deed'}
];

let userProfile = null;
let currentCase = null;
let currentView = "login";
let selectedStage = "agreement";
let historyStack = [];
let unsubscribeCase = null;
let unsubscribeMessages = null;

function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return esc(s).replace(/`/g,'&#96;');}
function visibleStages(flags){return STAGE_TEMPLATE.filter(s=>!s.cond || flags?.[s.cond]);}
function statusLabel(st){return st==='done'?'Done':st==='waiting_client'?'Waiting on you':st==='in_progress'?'In progress':'Pending';}
function tsLabel(ts){
  if(!ts) return 'Just now';
  try { return ts.toDate().toLocaleString(); } catch { return 'Just now'; }
}
function notify(message, error=false){
  const el=document.getElementById('toast');
  if(!el)return;
  el.textContent=message;
  el.style.display='block';
  el.dataset.error=error?'1':'0';
  el.classList.toggle('toast-error',!!error);
  setTimeout(()=>el.style.display='none',3500);
}

function loginScreen(){
  document.body.innerHTML = `
    <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);">
      <div class="panel" style="max-width:430px;width:100%;">
        <div class="brand" style="margin-bottom:18px;"><span class="mark">📜 Casefile</span><span class="tag">Secure registration portal</span></div>
        <div class="viewswitch" style="width:100%;margin-bottom:18px;">
          <button id="loginClient" class="active" style="flex:1;">Client</button>
          <button id="loginAdmin" style="flex:1;">Admin</button>
        </div>
        <h3 id="authTitle">Client login</h3>
        <p id="authHelp" class="explainer">Sign in to your case portal, or create a client account and wait for approval.</p>
        <input id="authName" placeholder="Full name (sign-up only)" style="display:none;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin:5px 0;">
        <input id="authEmail" type="email" placeholder="Email" autocomplete="email" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin:5px 0;">
        <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin:5px 0;">
        <div id="signupOnly" style="display:none;margin:8px 0;font-size:12px;color:var(--ink-soft);">New client accounts require admin approval before a case can be accessed.</div>
        <div class="btnrow" style="margin-top:14px;">
          <button class="act primary" id="authSubmit">Sign in</button>
          <button class="act" id="authToggle">Create client account</button>
        </div>
        <p id="authStatus" style="font-size:12px;color:var(--ink-soft);margin-top:12px;">${firebaseReady?'':'⚠ Firebase is not configured yet. Replace the PASTE_… values in FIREBASE_CONFIG (top of the script) to enable sign-in.'}</p>
      </div>
    </div>
    <div id="toast" style="display:none;position:fixed;right:18px;bottom:18px;padding:11px 15px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:12px;z-index:100;"></div>`;
  bindAuthUI();
}

function bindAuthUI(){
  let admin=false, signup=false;
  const clientBtn=document.getElementById('loginClient'), adminBtn=document.getElementById('loginAdmin');
  const title=document.getElementById('authTitle'), help=document.getElementById('authHelp');
  const name=document.getElementById('authName'), signupOnly=document.getElementById('signupOnly');
  const submit=document.getElementById('authSubmit'), toggle=document.getElementById('authToggle');
  const status=document.getElementById('authStatus');

  function refresh(){
    clientBtn.classList.toggle('active',!admin); adminBtn.classList.toggle('active',admin);
    title.textContent=admin?'Admin login':signup?'Client sign-up':'Client login';
    help.textContent=admin?'Admin accounts are created manually in Firebase Console.':signup?'Create an account, then wait for the administrator to approve your case.':'Sign in to your case portal.';
    name.style.display=(!admin&&signup)?'block':'none'; signupOnly.style.display=(!admin&&signup)?'block':'none';
    submit.textContent=signup?'Create account':'Sign in';
    toggle.style.display=admin?'none':'inline-block';
    toggle.textContent=signup?'Back to login':'Create client account';
    if(firebaseReady) status.textContent='';
  }
  clientBtn.onclick=()=>{admin=false;signup=false;refresh();};
  adminBtn.onclick=()=>{admin=true;signup=false;refresh();};
  toggle.onclick=()=>{signup=!signup;refresh();};

  submit.onclick=async()=>{
    if(!firebaseReady){status.textContent='Firebase is not configured. Add your project config in FIREBASE_CONFIG first.';return;}
    status.textContent='Working…'; submit.disabled=true;
    try{
      const email=document.getElementById('authEmail').value.trim();
      const pw=document.getElementById('authPassword').value;
      if(!email||!pw) throw new Error('Enter your email and password.');
      if(signup){
        const fullName=name.value.trim(); if(!fullName) throw new Error('Enter your full name.');
        signingUp=true;
        const cred=await createUserWithEmailAndPassword(auth,email,pw);
        await setDoc(doc(db,'users',cred.user.uid),{
          email, name:fullName, role:'client', status:'pending',
          createdAt:serverTimestamp()
        });
        await signOut(auth);
        signingUp=false;
        signup=false; refresh();
        status.textContent='Account created. An administrator must approve it before you can sign in.';
        return;
      }
      await signInWithEmailAndPassword(auth,email,pw);
    }catch(e){signingUp=false;status.textContent=e.message||'Authentication failed.'; }
    finally{submit.disabled=false;}
  };
  refresh();
}

async function loadProfile(uid){
  const snap=await getDoc(doc(db,'users',uid));
  if(!snap.exists()){
    // Admins are intentionally not auto-created here.
    const a=await getDoc(doc(db,'admins',uid));
    if(a.exists()) return {uid,role:'admin',status:'active',email:auth.currentUser.email};
    return null;
  }
  return {uid,...snap.data()};
}

async function findCaseForClient(uid){
  const q=query(collection(db,'cases'),where('clientUid','==',uid),limit(1));
  const s=await getDocs(q); return s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};
}

async function createCaseForClient(profile){
  const ref=doc(collection(db,'cases'));
  const flags={hasPOA:true,hasLoan:true};
  const stages={};
  visibleStages(flags).forEach((s,i)=>stages[s.id]={
    status:i===0?'in_progress':'pending', proofNote:'', approved:false,
    files:[], baselineText:'', clientText:'', editingLocked:true,
    updatedAt:serverTimestamp()
  });
  await setDoc(ref,{

async function subscribeClientCase(){
  if(unsubscribeCase) unsubscribeCase();
  let c=await findCaseForClient(userProfile.uid);
  if(!c){
    if(userProfile.status==='pending'){showWaiting();return;}
    if(userProfile.status==='revoked'){showRevoked();return;}
    showWaiting(); return;
  }
  currentCase=c; currentView='client'; selectedStage=c.selectedStage||'agreement';
  unsubscribeCase=onSnapshot(doc(db,'cases',c.id),snap=>{
    if(!snap.exists()){showWaiting();return;}
    currentCase={...snap.data(),id:snap.id,_messages:currentCase?._messages,_files:currentCase?._files}; selectedStage=currentCase.selectedStage||selectedStage; renderApp();
  },err=>notify(err.message,true));
  subscribeMessages();
}

function subscribeMessages(){
  if(unsubscribeMessages) unsubscribeMessages();
  if(!currentCase)return;
  const q=query(collection(db,'cases',currentCase.id,'messages'),orderBy('createdAt','asc'));
  unsubscribeMessages=onSnapshot(q,s=>{
    currentCase._messages=s.docs.map(d=>({id:d.id,...d.data()})); renderApp();
  },err=>notify(err.message,true));
  if(window._unsubFiles)window._unsubFiles();
  window._unsubFiles=onSnapshot(collection(db,'cases',currentCase.id,'files'),s=>{currentCase._files=s.docs.map(d=>({id:d.id,...d.data()}));renderApp();},err=>notify(err.message,true));
}

/* ---------- Word-style editor helpers ---------- */
function clean(html){
  const d=new DOMParser().parseFromString(html||'','text/html');
  d.querySelectorAll('script,style,iframe,object,embed,link,meta,img,form,base').forEach(n=>n.remove());
  d.body.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{const k=a.name.toLowerCase();if(k.startsWith('on')||(k==='style'&&/expression|url\(/i.test(a.value))||(k==='href'&&/^\s*javascript:/i.test(a.value)))n.removeAttribute(a.name);}));
  return d.body.innerHTML;
}
function htmlText(h){const d=document.createElement('div');d.innerHTML=clean(h);return d.textContent||'';}
const slim=o=>{const {baselineHtml,clientHtml,baselineText,clientText,...r}=o||{};return r;};
function rteHtml(id,html,locked){
  const b=(c,l,v)=>`<button type="button" data-cmd="${c}" ${v?`data-val="${v}"`:''} ${locked?'disabled':''}>${l}</button>`;
  return `<div class="rte"><div class="rte-bar">${b('undo','↶')}${b('redo','↷')}${b('bold','<b>B</b>')}${b('italic','<i>I</i>')}${b('underline','<u>U</u>')}${b('formatBlock','H1','h1')}${b('formatBlock','H2','h2')}${b('formatBlock','Text','p')}${b('insertUnorderedList','• List')}${b('insertOrderedList','1. List')}${b('justifyLeft','⇤')}${b('justifyCenter','↔')}${b('justifyRight','⇥')}${b('justifyFull','☰')}</div><div class="rte-body" id="${id}" contenteditable="${locked?'false':'true'}">${clean(html)}</div></div>`;
}
function wireRte(root,onInput){
  root.querySelectorAll('.rte-bar button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.val||null);onInput&&onInput();};});
  const body=root.querySelector('.rte-body');body.oninput=()=>onInput&&onInput();
  body.onpaste=e=>{e.preventDefault();const h=e.clipboardData.getData('text/html'),t=e.clipboardData.getData('text/plain');document.execCommand('insertHTML',false,h?clean(h):esc(t).replace(/\n/g,'<br>'));};
}
function downloadDocx(html,name){
  const blob=window.htmlDocx.asBlob('<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font-family:Georgia,serif">'+clean(html)+'</body></html>');
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(name||'document')+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function openFile(fid){
  const f=(currentCase._files||[]).find(x=>x.id===fid);if(!f)return;
  try{
    const sn=await getDocs(collection(db,'cases',currentCase.id,'files',fid,'chunks'));
    const parts=sn.docs.sort((a,b)=>a.id<b.id?-1:1).map(d=>Uint8Array.from(atob(d.data().data),c=>c.charCodeAt(0)));
    const url=URL.createObjectURL(new Blob(parts,{type:f.type||'application/octet-stream'}));
    const pv=/^image\//.test(f.type)?`<img src="${url}" style="max-width:100%;border-radius:6px;">`:f.type==='application/pdf'?`<iframe src="${url}" style="width:100%;height:60vh;border:0;background:#fff"></iframe>`:'<p>No preview for this file type.</p>';
    openModal(`<h4>${esc(f.name)}</h4>${pv}<div class="btnrow" style="margin-top:14px;"><a class="act primary" href="${url}" download="${esc(f.name)}">Download</a><button class="act" id="fvClose">Close</button></div>`);

  }catch(e){notify(e.message,true);}

function highlightChanges(base,edited){
  if(base===edited)return esc(edited);
  // Lightweight character diff suitable for a review view; history retains exact versions.
  let prefix=0; while(prefix<base.length&&prefix<edited.length&&base[prefix]===edited[prefix])prefix++;
  let suffix=0; while(suffix<base.length-prefix&&suffix<edited.length-prefix&&base[base.length-1-suffix]===edited[edited.length-1-suffix])suffix++;
  return esc(base.slice(0,prefix))+
    `<del style="color:var(--danger);background:rgba(162,59,51,.08);">${esc(base.slice(prefix,base.length-suffix))}</del>`+
    `<ins style="color:var(--green);background:var(--green-soft);text-decoration:none;">${esc(edited.slice(prefix,edited.length-suffix))}</ins>`+
    esc(base.slice(base.length-suffix));
}

async function toggleFlag(key){

async function handleAction(action,stageId){
  const ref=doc(db,'cases',currentCase.id);const d=currentCase.stages[stageId];
  if(action==='progress')return updateStage(stageId,{status:'in_progress'});
  if(action==='done')return openAttachModal(stageId);
  if(action==='send')return openSendModal(stageId);
  if(action==='editor')return updateStage(stageId,{editingLocked:!d.editingLocked});
  if(action==='history')return showHistory(stageId);
  if(action==='approve')return confirmAction('Approve this stage?',async()=>{await updateStage(stageId,{approved:true,status:'done'});await sendMessage(stageId,'client','Approved — looks good, please proceed to the next step.');});
  if(action==='changes')return openRequestModal(stageId);
}
async function updateStage(stageId,patch){

  await updateDoc(ref,{[`stages.${stageId}`]:{...old,...patch,updatedAt:serverTimestamp()},updatedAt:serverTimestamp()});
}

/*
 * Firestore chunked file storage.
 * Limits each file to 3 MB. Each chunk is kept in:
 * cases/{caseId}/files/{fileId}/chunks/{chunkId}
 */
async function uploadFile(kind,refId,file=null){
  if(!file){
    const input=document.createElement('input');input.type='file';input.accept='application/pdf,image/*';
    input.onchange=()=>{if(input.files[0])uploadFile(kind,refId,input.files[0]);};input.click();return;
  }
  if(file.size>3*1024*1024){notify('File is larger than the 3 MB limit.',true);return;}
  const fileRef=doc(collection(db,'cases',currentCase.id,'files'));
  await setDoc(fileRef,{name:file.name,type:file.type,size:file.size,kind,refId,ownerUid:userProfile.uid,createdAt:serverTimestamp()});
  const bytes=new Uint8Array(await file.arrayBuffer());const chunkSize=700000;
  for(let i=0;i<bytes.length;i+=chunkSize){
    const b=bytes.slice(i,i+chunkSize);
    let binary='';for(const x of b)binary+=String.fromCharCode(x);
    const data=btoa(binary);
    await setDoc(doc(fileRef,'chunks',String(Math.floor(i/chunkSize)).padStart(6,'0')),{data,createdAt:serverTimestamp()});
  }
  notify('File uploaded.');
}

function renderAdmin(){
  document.body.innerHTML=`<div class="topbar"><div class="brand"><span class="mark">📜 Casefile</span><span class="tag">Admin console</span></div><div class="topright"><button class="act" id="adminLogout">Sign out</button></div></div><div class="main" style="max-width:1100px;margin:auto;"><div class="panel"><h3>Client approvals</h3><div id="pendingClients">Loading…</div></div><div class="panel"><h3>Cases</h3><div id="caseList">Loading…</div></div></div><div id="toast" style="display:none;position:fixed;right:18px;bottom:18px;padding:11px 15px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:12px;z-index:100;"></div>`;
  document.getElementById('adminLogout').onclick=()=>signOut(auth);
  loadAdminLists();
}
async function loadAdminLists(){
  const pending=await getDocs(query(collection(db,'users'),where('status','==','pending')));
  document.getElementById('pendingClients').innerHTML=pending.empty?'<p class="explainer">No pending clients.</p>':pending.docs.map(d=>{const u=d.data();return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;"><div><strong>${esc(u.name||u.email)}</strong><div style="font-size:12px;color:var(--ink-soft);">${esc(u.email)}</div></div><div class="btnrow"><button class="act approve" data-approve="${d.id}">Approve</button><button class="act request" data-reject="${d.id}">Reject</button></div></div>`}).join('');
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approveClient(b.dataset.approve));
  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>rejectClient(b.dataset.reject));
  const cases=await getDocs(query(collection(db,'cases'),orderBy('updatedAt','desc'),limit(50)));
  document.getElementById('caseList').innerHTML=cases.empty?'<p class="explainer">No cases.</p>':cases.docs.map(d=>{const c=d.data();return `<div class="doc" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div><strong>${esc(c.property||'Case')}</strong><div class="meta">${esc(c.clientName||'')} · ${esc(c.address||'')}</div></div><button class="act" data-case="${d.id}">Open</button></div>`}).join('');
  document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openAdminCase(b.dataset.case));
}
async function approveClient(uid){
  const u=(await getDoc(doc(db,'users',uid))).data();if(!u)return;
  const caseId=await createCaseForClient({uid,name:u.name,email:u.email});
  await updateDoc(doc(db,'users',uid),{status:'approved',caseId,approvedAt:serverTimestamp(),approvedBy:userProfile.uid});
  notify('Client approved.');loadAdminLists();
}
async function rejectClient(uid){await updateDoc(doc(db,'users',uid),{status:'rejected',rejectedAt:serverTimestamp(),rejectedBy:userProfile.uid});notify('Client rejected.');loadAdminLists();}
async function openAdminCase(caseId){
  const s=await getDoc(doc(db,'cases',caseId));if(!s.exists())return;
  currentCase={id:s.id,...s.data()};currentView='admin';selectedStage=currentCase.selectedStage||'agreement';subscribeMessages();if(unsubscribeCase)unsubscribeCase();unsubscribeCase=onSnapshot(doc(db,'cases',caseId),sn=>{if(!sn.exists())return;const p=currentCase;currentCase={...sn.data(),id:sn.id,_messages:p?._messages,_files:p?._files};renderApp();},err=>notify(err.message,true));renderApp();
}

// Always show the login screen first so the page is never blank.
loginScreen();

if(firebaseReady) onAuthStateChanged(auth,async(user)=>{
  if(signingUp) return;
  if(!user){userProfile=null;loginScreen();return;}
  try{
    userProfile=await loadProfile(user.uid);
    if(!userProfile){await signOut(auth);loginScreen();notify('Account is not authorised.',true);return;}
    if(userProfile.role==='admin'){await subscribeAdmin();return;}
    if(userProfile.status==='pending'){await signOut(auth);loginScreen();notify('Your account is awaiting approval.');return;}
    if(userProfile.status==='rejected'){await signOut(auth);loginScreen();notify('Your account was rejected.',true);return;}
    if(userProfile.status==='revoked'){await signOut(auth);showRevoked();return;}
    await subscribeClientCase();
  }catch(e){console.error(e);await signOut(auth).catch(()=>{});loginScreen();notify(e.message||'Could not load your account.',true);}
});

window.addEventListener('beforeunload',()=>{if(unsubscribeCase)unsubscribeCase();if(unsubscribeMessages)unsubscribeMessages();});
</script>
